name: Build OpenClash Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build OpenClash Package
        run: |
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载 OpenWrt 官方 ipkg-build 打包工具
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /tmp/ipkg-build
          chmod +x /tmp/ipkg-build

          # 2. 拉取 vernesong/OpenClash 最新主分支源码
          git clone --depth=1 https://github.com/vernesong/OpenClash.git openclash_src

          # 3. 解析版本号
          VERSION=$(grep -oP "pkgver=\K[^\s]+" openclash_src/luci-app-openclash/Makefile 2>/dev/null || echo "0.47.156")

          # 4. 构建 IPK 目录结构
          mkdir -p ipk_openclash/CONTROL
          cp -r openclash_src/luci-app-openclash/luasrc ipk_openclash/usr/lib/lua/luci 2>/dev/null || true
          cp -r openclash_src/luci-app-openclash/root/* ipk_openclash/ 2>/dev/null || true

          # 5. 写入适配 R2S/E20C 固件的 Control 描述文件
          cat << EOF > ipk_openclash/CONTROL/control
          Package: luci-app-openclash
          Version: ${VERSION}
          Depends: luci, luci-base, luci-compat, bash, dnsmasq-full, curl, ca-bundle, ip-full, ruby, ruby-yaml, kmod-tun, kmod-inet-diag, unzip, kmod-nft-tproxy
          Architecture: all
          Maintainer: vernesong
          Description: OpenClash plugin for OpenWrt (Compatible with R2S / E20C RK3328)
          EOF

          # 6. 生成 IPK 安装包
          /tmp/ipkg-build ipk_openclash "$OUT_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-openclash-r2s-e20c
          path: output/*.ipk
