name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Building Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache gettext git libncurses5-dev xsltproc golang

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 1. 下载适用于 NanoPi R2S (aarch64) 的 OpenWrt SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-*.tar.xz
          cd openwrt-sdk-*

          # 2. 更新并安装官方全量 feeds 软件包源
          ./scripts/feeds update -a
          ./scripts/feeds install frpc luci-app-frpc luci-i18n-frpc-zh-cn

          # 3. 编译官方源中的 frpc 和后台 Web 界面
          make package/feeds/packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-packages
          path: openwrt-sdk-*/bin/packages/
