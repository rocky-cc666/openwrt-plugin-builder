name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 配置 Node.js 环境（用于构建 FRP 0.70+ 前端界面）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. 配置 Go 1.25+ 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 3. 下载并解压适配 Rockchip armv8 (NanoPi R2S / Radxa E20C) 的官方 SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 4. 进入 SDK 目录
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

          # 5. 更新并安装官方 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install frpc frps luci-app-frpc luci-i18n-frpc-zh-cn

          # 6. 下载最新的 FRP v0.71.0 Makefile 并替换官方旧定义
          wget -O feeds/packages/net/frp/Makefile https://raw.githubusercontent.com/sbwml/openwrt-packages/master/openwrt-23.05/frp/Makefile || \
          wget -O feeds/packages/net/frp/Makefile https://raw.githubusercontent.com/sbwml/openwrt-packages/main/frp/Makefile

          # 7. 解除 SDK 对 Go 工具链的锁定
          find feeds/packages/lang/golang/ -type f -exec sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' {} + || true

          # 8. 生成配置并编译最新 FRP v0.71.0 及 LuCI 界面
          make defconfig
          GOTOOLCHAIN=auto PATH=$(which go):$PATH make package/feeds/packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-packages
          path: openwrt-sdk-*/bin/packages/
