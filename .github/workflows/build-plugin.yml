name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 1. 下载并解压适配 Rockchip armv8 (NanoPi R2S / Radxa E20C) 的官方 SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 2. 进入 SDK 目录
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

          # 3. 更新并安装基础 feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-frpc luci-i18n-frpc-zh-cn

          # 4. 拉取第三方全量包，提取最新 FRP 源码到 package/ 目录
          git clone --depth=1 https://github.com/sbwml/openwrt-packages.git /tmp/openwrt-packages
          cp -r /tmp/openwrt-packages/frp package/frp
          
          # 5. 生成配置文件并强行指定编译
          make defconfig
          make package/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-packages
          path: openwrt-sdk-*/bin/packages/
