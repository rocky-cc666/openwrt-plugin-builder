name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 配置 Go 1.25+ 环境
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 2. 下载并解压适配 Rockchip armv8 (NanoPi R2S / Radxa E20C) 的官方 SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 3. 进入 SDK 目录
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

          # 4. 更新并安装官方 feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install frpc frps luci-app-frpc luci-i18n-frpc-zh-cn

          # 5. 直接生成适配 v0.71.0 的 Makefile，避免 404 及编译依赖缺失
          cat << 'EOF' > feeds/packages/net/frp/Makefile
          include $(TOPDIR)/rules.mk

          PKG_NAME:=frp
          PKG_VERSION:=0.71.0
          PKG_RELEASE:=1

          PKG_SOURCE:=$(PKG_NAME)-$(PKG_VERSION).tar.gz
          PKG_SOURCE_URL:=https://codeload.github.com/fatedier/frp/tar.gz/v$(PKG_VERSION)?
          PKG_HASH:=skip

          PKG_LICENSE:=Apache-2.0
          PKG_LICENSE_FILES:=LICENSE

          PKG_BUILD_DEPENDS:=golang/host
          PKG_BUILD_PARALLEL:=1
          PKG_USE_MIPS16:=0

          GO_PKG:=github.com/fatedier/frp
          GO_PKG_BUILD_FAIL_ON_WRONG_PAD:=0

          include $(INCLUDE_DIR)/package.mk
          include $(TOPDIR)/feeds/packages/lang/golang/golang-package.mk

          define Package/frp/template
            SECTION:=net
            CATEGORY:=Network
            SUBMENU:=IP Addresses and Names
            TITLE:=A fast reverse proxy
            URL:=https://github.com/fatedier/frp
          endef

          define Package/frpc
            $(call Package/frp/template)
            TITLE+= (client)
            DEPENDS:=$(GO_ARCH_DEPENDS)
          endef

          define Package/frps
            $(call Package/frp/template)
            TITLE+= (server)
            DEPENDS:=$(GO_ARCH_DEPENDS)
          endef

          define Package/frpc/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(GO_PKG_BUILD_BIN_DIR)/frpc $(1)/usr/bin/
          endef

          define Package/frps/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(GO_PKG_BUILD_BIN_DIR)/frps $(1)/usr/bin/
          endef

          $(eval $(call BuildPackage,frpc))
          $(eval $(call BuildPackage,frps))
          EOF

          # 6. 解除 SDK 对 Go 工具链的锁定
          find feeds/packages/lang/golang/ -type f -exec sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' {} + || true

          # 7. 生成配置并编译最新 FRP v0.71.0 及 LuCI 界面
          make defconfig
          GOTOOLCHAIN=auto PATH=$(which go):$PATH make package/feeds/packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-packages
          path: openwrt-sdk-*/bin/packages/
