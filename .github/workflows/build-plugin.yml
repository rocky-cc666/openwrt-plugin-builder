name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 安装系统最新的 Go 环境 (1.25 及以上)
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 2. 下载并解压适配 Rockchip armv8 的官方 SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 3. 进入 SDK 目录
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

          # 4. 更新并安装官方 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install frpc frps luci-app-frpc luci-i18n-frpc-zh-cn

          # 5. 修改 Makefile，将 FRP 版本号指定为 0.71.0
          sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=0.71.0/' feeds/packages/net/frp/Makefile
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/net/frp/Makefile

          # 6. 生成基础配置
          make defconfig

          # 7. 全局覆盖 OpenWrt 编译 Go 时硬编码的 GOTOOLCHAIN 参数
          # 将 GOTOOLCHAIN=local 强制替换为 GOTOOLCHAIN=auto，允许 Go 自动使用/升级工具链
          find feeds/packages/lang/golang/ -type f -exec sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' {} +
          find include/ -type f -exec sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' {} + || true

          # 8. 编译最新版 frp 及界面 (在 make 命令层强行传入环境变量)
          GOTOOLCHAIN=auto PATH=$(which go):$PATH make package/feeds/packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-packages
          path: openwrt-sdk-*/bin/packages/
