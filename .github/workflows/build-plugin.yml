name: Build OpenWrt FRP Plugin (25.12.5)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 1. 下载并解压适配 25.12.5 (Rockchip armv8) 的官方 SDK
          wget https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8/openwrt-sdk-25.12.5-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-25.12.5-*.tar.xz
          
          # 2. 精确进入 SDK 目录
          cd openwrt-sdk-25.12.5-*

          # 3. 更新并安装基础 feeds 依赖
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-frpc luci-i18n-frpc-zh-cn

          # 4. 拉取第三方全量包，引入 FRP v0.71.0 源码
          git clone https://github.com/sbwml/openwrt-packages.git package/openwrt-packages
          
          # 5. 生成配置文件并编译
          make defconfig
          make package/openwrt-packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-frp-packages
          path: openwrt-sdk-*/bin/packages/
