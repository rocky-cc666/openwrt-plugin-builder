name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build FRP v0.71.0 IPK Package
        run: |
          FRP_VER="0.71.0"
          
          # 1. 下载 FRP 官方 0.71.0 aarch64 架构二进制文件
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_arm64.tar.gz
          tar -xzf frp_${FRP_VER}_linux_arm64.tar.gz

          # 2. 创建 IPK 打包目录结构
          mkdir -p ipk_build/CONTROL
          mkdir -p ipk_build/usr/bin
          mkdir -p ipk_build/etc/init.d
          mkdir -p output

          # 3. 复制二进制文件
          cp frp_${FRP_VER}_linux_arm64/frpc ipk_build/usr/bin/
          cp frp_${FRP_VER}_linux_arm64/frps ipk_build/usr/bin/
          chmod +x ipk_build/usr/bin/*

          # 4. 写入 OpenWrt 控制描述文件 (Control File)
          cat << EOF > ipk_build/CONTROL/control
          Package: frp
          Version: ${FRP_VER}-1
          Depends: libc
          Architecture: aarch64_generic
          Maintainer: OpenWrt
          Description: A fast reverse proxy (v0.71.0 official binary for Rockchip/ARM64)
          EOF

          # 5. 打包为 OpenWrt .ipk 安装包
          dpkg-deb -b --root-owner-group ipk_build output/frp_${FRP_VER}-1_aarch64_generic.ipk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-ipk
          path: output/*.ipk
