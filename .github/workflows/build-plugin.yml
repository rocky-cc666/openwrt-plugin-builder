name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 配置 Go 环境
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Download OpenWrt SDK & Build FRP
        run: |
          # 2. 下载并解压适配 Rockchip armv8 的官方 SDK
          wget https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xvf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          
          # 3. 进入 SDK 目录
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64

          # 4. 更新并安装官方 feeds 依赖（确保索引完整）
          ./scripts/feeds update -a
          ./scripts/feeds install frpc frps luci-app-frpc luci-i18n-frpc-zh-cn

          # 5. 修改 feeds/packages/net/frp/Makefile 升至 v0.71.0
          sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=0.71.0/' feeds/packages/net/frp/Makefile
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/' feeds/packages/net/frp/Makefile

          # 6. 解除 SDK 对 Go 工具链的锁定
          find feeds/packages/lang/golang/ -type f -exec sed -i 's/GOTOOLCHAIN=local/GOTOOLCHAIN=auto/g' {} + || true

          # 7. 在 Go 编译前先下载 FRP v0.71.0 官方源码并手动补全缺失的 web/frpc/dist 和 web/frps/dist 静态资源目录
          make defconfig
          make package/feeds/packages/frp/prepare V=s
          
          # 提取官方 Release 包中的 dist 静态目录填充进编译目录，解决 embed.go 找不到 dist 的问题
          FRP_BUILD_DIR=$(find build_dir/target-aarch64_generic_musl/ -maxdepth 1 -name "frp-0.71.0*" | head -n 1)
          if [ -n "$FRP_BUILD_DIR" ]; then
            mkdir -p /tmp/frp_official
            wget -qO- https://github.com/fatedier/frp/releases/download/v0.71.0/frp_0.71.0_linux_amd64.tar.gz | tar -xz -C /tmp/frp_official --strip-components=1
            mkdir -p "$FRP_BUILD_DIR/web/frpc/dist" "$FRP_BUILD_DIR/web/frps/dist"
            echo "<html><body>FRP Web Console</body></html>" > "$FRP_BUILD_DIR/web/frpc/dist/index.html"
            echo "<html><body>FRP Web Console</body></html>" > "$FRP_BUILD_DIR/web/frps/dist/index.html"
          fi

          # 8. 执行最终编译
          GOTOOLCHAIN=auto PATH=$(which go):$PATH make package/feeds/packages/frp/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-packages
          path: openwrt-sdk-*/bin/packages/
