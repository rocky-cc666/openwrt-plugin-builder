name: Build TencentCloud DDNS APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.5"
  TENCENT_REPO: "https://github.com/Tencent-Cloud-Plugins/tencentcloud-openwrt-plugin-ddns.git"
  TENCENT_REF: "master"
  PACKAGE_NAME: "luci-app-tencentddns"

jobs:
  build:
    name: OpenWrt 25.12.5 - TencentCloud DDNS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            file \
            curl \
            zstd \
            xz-utils \
            ca-certificates

      - name: Download OpenWrt 25.12.5 SDK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/sdk"

          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/armsr/armv8/openwrt-sdk-${OPENWRT_VERSION}-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

          echo "Downloading OpenWrt SDK:"
          echo "$SDK_URL"

          curl -fL \
            "$SDK_URL" \
            -o "$GITHUB_WORKSPACE/sdk.tar.zst"

          tar \
            --use-compress-program=unzstd \
            -xf "$GITHUB_WORKSPACE/sdk.tar.zst" \
            --strip-components=1 \
            -C "$GITHUB_WORKSPACE/sdk"

          rm -f "$GITHUB_WORKSPACE/sdk.tar.zst"

          test -x "$GITHUB_WORKSPACE/sdk/scripts/feeds"

          echo "OpenWrt SDK ready."

      - name: Clone TencentCloud DDNS source
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/tencentcloud-source"

          git clone \
            --depth 1 \
            --branch "$TENCENT_REF" \
            "$TENCENT_REPO" \
            "$GITHUB_WORKSPACE/tencentcloud-source"

          echo "TencentCloud source revision:"
          git -C "$GITHUB_WORKSPACE/tencentcloud-source" rev-parse HEAD

      - name: Locate original OpenWrt package
        shell: bash
        run: |
          set -eux

          if [ -d "$GITHUB_WORKSPACE/tencentcloud-source/tencentcloud_ddns" ]; then
            PACKAGE_DIR="$GITHUB_WORKSPACE/tencentcloud-source/tencentcloud_ddns"
          elif [ -d "$GITHUB_WORKSPACE/tencentcloud-source/package/tencentcloud_ddns" ]; then
            PACKAGE_DIR="$GITHUB_WORKSPACE/tencentcloud-source/package/tencentcloud_ddns"
          else
            echo "ERROR: TencentCloud package directory not found."

            find \
              "$GITHUB_WORKSPACE/tencentcloud-source" \
              -maxdepth 5 \
              -type f \
              -name Makefile \
              -print

            exit 1
          fi

          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"

          echo "Using package:"
          echo "$PACKAGE_DIR"

      - name: Show original package
        shell: bash
        run: |
          set -eux

          echo "===== Original Makefile ====="

          cat "$PACKAGE_DIR/Makefile"

      - name: Copy package into SDK
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/sdk/package/tencentcloud_ddns"

          mkdir -p \
            "$GITHUB_WORKSPACE/sdk/package/tencentcloud_ddns"

          cp -a \
            "$PACKAGE_DIR/." \
            "$GITHUB_WORKSPACE/sdk/package/tencentcloud_ddns/"

          echo "===== Package tree ====="

          find \
            "$GITHUB_WORKSPACE/sdk/package/tencentcloud_ddns" \
            -type f \
            | sort

      - name: Adapt package for OpenWrt 25.12
        shell: bash
        run: |
          set -eux

          MAKEFILE="$GITHUB_WORKSPACE/sdk/package/tencentcloud_ddns/Makefile"

          test -f "$MAKEFILE"

          python3 - "$MAKEFILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])

          text = path.read_text()

          text = re.sub(
              r'^PKG_NAME:=.*$',
              'PKG_NAME:=luci-app-tencentddns',
              text,
              flags=re.MULTILINE
          )

          text = re.sub(
              r'^PKG_RELEASE:=.*$',
              'PKG_RELEASE:=2',
              text,
              flags=re.MULTILINE
          )

          if re.search(
              r'^PKGARCH:=',
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r'^PKGARCH:=.*$',
                  'PKGARCH:=all',
                  text,
                  flags=re.MULTILINE
              )
          else:
              text += '\nPKGARCH:=all\n'

          path.write_text(text)
          PY

          echo "===== Patched Makefile ====="

          cat "$MAKEFILE"

      - name: Update OpenWrt feeds
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure SDK
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          make defconfig

      - name: Build TencentCloud DDNS
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          make package/tencentcloud_ddns/clean V=s || true

          make \
            package/tencentcloud_ddns/compile \
            V=s \
            -j"$(nproc)"

      - name: Find APK
        shell: bash
        run: |
          set -eux

          echo "===== All APK packages ====="

          find \
            "$GITHUB_WORKSPACE/sdk/bin/packages" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          echo
          echo "===== TencentCloud DDNS APK ====="

          find \
            "$GITHUB_WORKSPACE/sdk/bin/packages" \
            -type f \
            -name "luci-app-tencentddns_*.apk" \
            -print \
            | sort

      - name: Collect APK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/dist"

          mapfile -t APK_FILES < <(
            find \
              "$GITHUB_WORKSPACE/sdk/bin/packages" \
              -type f \
              -name "luci-app-tencentddns_*.apk"
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No TencentCloud DDNS APK was generated."
            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            cp "$apk" "$GITHUB_WORKSPACE/dist/"
          done

          sha256sum \
            "$GITHUB_WORKSPACE/dist/"*.apk \
            > "$GITHUB_WORKSPACE/dist/SHA256SUMS"

          echo "===== Final APK ====="

          ls -lh "$GITHUB_WORKSPACE/dist/"

          file "$GITHUB_WORKSPACE/dist/"*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tencentcloud-ddns-openwrt-25.12.5
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-25.12.5-build-${{ github.run_number }}
          name: TencentCloud DDNS APK - OpenWrt 25.12.5 build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
