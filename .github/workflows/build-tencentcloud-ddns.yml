name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}-${{ matrix.subtarget }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 适用于 NanoPi R2S (RK3328) 与 E20C 等 Rockchip ARMv8 设备
          - target: rockchip
            subtarget: armv8

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl

    - name: 下载并解压 OpenWrt SDK (.apk 兼容版)
      run: |
        # 直接使用官方 Snapshots 镜像服务器上最新 SDK 的固定指向地址
        BASE_URL="https://downloads.openwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
        
        # 提取页面中真实的 .tar.xz 文件名
        SDK_FILE=$(curl -sL "$BASE_URL/" | grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.xz' | head -n 1)

        if [ -z "$SDK_FILE" ]; then
          echo "无法通过页面提取，使用默认镜像路径..."
          SDK_URL="https://downloads.openwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
        else
          SDK_URL="${BASE_URL}/${SDK_FILE}"
        fi

        echo "最终下载地址: $SDK_URL"
        
        # 带有自动重定向与防报错机制的下载
        curl -sL -A "Mozilla/5.0" "$SDK_URL" -o openwrt-sdk.tar.xz

        mkdir -p sdk
        tar -xJf openwrt-sdk.tar.xz -C sdk --strip-components=1
        rm openwrt-sdk.tar.xz

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        # 将当前仓库的插件源码复制到 package 目录
        mkdir -p package/tencentcloud-ddns
        cp -r ../* package/tencentcloud-ddns/ 2>/dev/null || true
        
        # 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        make defconfig
        # 编译生成 apk 格式的安装包
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-${{ matrix.target }}-${{ matrix.subtarget }}-apk
        # 匹配编译出来的 .apk 格式文件
        path: sdk/bin/packages/${{ matrix.target }}/base/*.apk
