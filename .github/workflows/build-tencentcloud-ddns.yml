name: Build TencentCloud DDNS APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: "25.12.5"
  SDK_TARGET: "armsr"
  SDK_SUBTARGET: "armv8"

  TENCENT_REPO: "https://github.com/Tencent-Cloud-Plugins/tencentcloud-openwrt-plugin-ddns.git"
  TENCENT_REF: "master"

  PACKAGE_NAME: "luci-app-tencentddns"
  PACKAGE_DIR: "luci-app-tencentddns"

jobs:
  build:
    name: OpenWrt 25.12.5 - TencentCloud DDNS
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout builder repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Host dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            wget \
            file \
            curl \
            zstd \
            xz-utils \
            ca-certificates


      # ============================================================
      # 3. Download OpenWrt SDK
      # ============================================================

      - name: Download OpenWrt 25.12.5 SDK
        shell: bash
        run: |
          set -eux

          SDK_DIR="$GITHUB_WORKSPACE/sdk"

          mkdir -p "$SDK_DIR"

          SDK_URL="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}/${SDK_SUBTARGET}/openwrt-sdk-${OPENWRT_VERSION}-${SDK_TARGET}-${SDK_SUBTARGET}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"

          echo "============================================================"
          echo "OpenWrt SDK"
          echo "============================================================"
          echo "$SDK_URL"

          curl -fL \
            "$SDK_URL" \
            -o "$GITHUB_WORKSPACE/openwrt-sdk.tar.zst"

          tar \
            --use-compress-program=unzstd \
            -xf "$GITHUB_WORKSPACE/openwrt-sdk.tar.zst" \
            --strip-components=1 \
            -C "$SDK_DIR"

          rm -f "$GITHUB_WORKSPACE/openwrt-sdk.tar.zst"

          test -x "$SDK_DIR/scripts/feeds"

          echo "SDK ready."


      # ============================================================
      # 4. Update ONLY the LuCI feed
      # ============================================================

      - name: Update LuCI feed
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          ./scripts/feeds update luci

          # Only install LuCI itself.
          #
          # DO NOT use:
          #
          #   ./scripts/feeds install -a
          #
          # because that installs every feed package definition.

          ./scripts/feeds install luci-base luci


      # ============================================================
      # 5. Download TencentCloud source
      # ============================================================

      - name: Clone TencentCloud DDNS source
        shell: bash
        run: |
          set -eux

          rm -rf "$GITHUB_WORKSPACE/tencentcloud-source"

          git clone \
            --depth 1 \
            --branch "$TENCENT_REF" \
            "$TENCENT_REPO" \
            "$GITHUB_WORKSPACE/tencentcloud-source"

          echo "TencentCloud source revision:"
          git -C "$GITHUB_WORKSPACE/tencentcloud-source" rev-parse HEAD


      # ============================================================
      # 6. Locate TencentCloud package
      # ============================================================

      - name: Locate TencentCloud package
        shell: bash
        run: |
          set -eux

          SOURCE_DIR="$GITHUB_WORKSPACE/tencentcloud-source/tencentcloud_ddns"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: TencentCloud package directory not found:"
            echo "$SOURCE_DIR"

            find \
              "$GITHUB_WORKSPACE/tencentcloud-source" \
              -maxdepth 5 \
              -type f \
              -name Makefile \
              -print

            exit 1
          fi

          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

          echo "TencentCloud package:"
          echo "$SOURCE_DIR"


      # ============================================================
      # 7. Copy package into SDK
      # ============================================================

      - name: Install TencentCloud package into SDK
        shell: bash
        run: |
          set -eux

          TARGET_DIR="$GITHUB_WORKSPACE/sdk/package/${PACKAGE_DIR}"

          rm -rf "$TARGET_DIR"

          mkdir -p "$TARGET_DIR"

          cp -a \
            "$SOURCE_DIR/." \
            "$TARGET_DIR/"

          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

          echo "Package tree:"
          find "$TARGET_DIR" -type f | sort


      # ============================================================
      # 8. Build po2lmo
      # ============================================================

      - name: Build TencentCloud po2lmo
        shell: bash
        run: |
          set -eux

          PO2LMO_DIR="$TARGET_DIR/tools/po2lmo"

          if [ ! -d "$PO2LMO_DIR" ]; then
            echo "ERROR: po2lmo source directory not found."
            exit 1
          fi

          cd "$PO2LMO_DIR"

          make

          test -x src/po2lmo

          sudo install \
            -m 0755 \
            src/po2lmo \
            /usr/local/bin/po2lmo

          command -v po2lmo

          po2lmo --help || true


      # ============================================================
      # 9. Patch package Makefile
      # ============================================================

      - name: Patch package for OpenWrt 25.12
        shell: bash
        run: |
          set -eux

          MAKEFILE="$TARGET_DIR/Makefile"

          test -f "$MAKEFILE"

          python3 - "$MAKEFILE" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])

          text = path.read_text()

          # --------------------------------------------------------
          # Package version
          # --------------------------------------------------------

          text = re.sub(
              r'^PKG_RELEASE:=.*$',
              'PKG_RELEASE:=2',
              text,
              flags=re.MULTILINE
          )

          # --------------------------------------------------------
          # Keep architecture "all"
          # --------------------------------------------------------

          if re.search(
              r'^PKGARCH:=',
              text,
              flags=re.MULTILINE
          ):
              text = re.sub(
                  r'^PKGARCH:=.*$',
                  'PKGARCH:=all',
                  text,
                  flags=re.MULTILINE
              )

          # --------------------------------------------------------
          # Keep original TencentCloud dependencies:
          #
          #   openssl-util
          #   curl
          #
          # Do not add kernel dependencies.
          # --------------------------------------------------------

          text = re.sub(
              r'^\s*DEPENDS:=.*$',
              '\tDEPENDS:=+openssl-util +curl',
              text,
              flags=re.MULTILINE
          )

          path.write_text(text)
          PY

          echo "============================================================"
          echo "Patched TencentCloud Makefile"
          echo "============================================================"

          cat "$MAKEFILE"


      # ============================================================
      # 10. IMPORTANT:
      #     Create a minimal SDK configuration
      #     FIXED: Force disable all kernel modules
      # ============================================================

      - name: Configure minimal package build
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          # Start from a clean minimal configuration.
          rm -f .config

          cat > .config <<'EOF'
          CONFIG_ALL=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_AUTOREMOVE=n

          CONFIG_DEVEL=y

          CONFIG_PACKAGE_luci-app-tencentddns=m
          EOF

          echo "============================================================"
          echo "Initial SDK configuration"
          echo "============================================================"

          cat .config

          # Run defconfig to resolve platform defaults
          make defconfig

          echo "============================================================"
          echo "After defconfig - checking for kernel modules"
          echo "============================================================"

          # Count kernel modules before cleanup
          KMOD_BEFORE=$(grep -c '^CONFIG_PACKAGE_kmod-' .config || true)
          echo "Kernel modules before cleanup: $KMOD_BEFORE"

          if [ "$KMOD_BEFORE" -gt 0 ]; then
            echo "Kernel modules found, forcing them off..."
            grep '^CONFIG_PACKAGE_kmod-' .config || true
          fi

          # Force disable ALL kernel modules
          sed -i '/^CONFIG_PACKAGE_kmod-/d' .config

          # Add explicit disable for any kmod that might be pulled in
          echo "# Force disable all kernel modules" >> .config
          echo "CONFIG_ALL_KMODS=n" >> .config

          # Re-run defconfig to resolve dependencies without kmods
          make defconfig

          # Double-check: if any kmod reappeared, force them off again
          # This can happen due to recursive dependencies
          if grep -q '^CONFIG_PACKAGE_kmod-' .config; then
            echo "WARNING: Some kernel modules reappeared, forcing them off again..."
            sed -i '/^CONFIG_PACKAGE_kmod-/d' .config
            make defconfig
          fi

          # Final verification
          KMOD_AFTER=$(grep -c '^CONFIG_PACKAGE_kmod-' .config || true)

          if [ "$KMOD_AFTER" -gt 0 ]; then
            echo "ERROR: $KMOD_AFTER kernel modules are still selected:"
            grep '^CONFIG_PACKAGE_kmod-' .config
            exit 1
          fi

          echo "============================================================"
          echo "Final relevant configuration"
          echo "============================================================"

          grep -E \
            'CONFIG_(ALL|ALL_KMODS|ALL_NONSHARED|AUTOREMOVE|PACKAGE_luci-app-tencentddns)' \
            .config \
            | grep -v '^#' || true

          echo "✓ All kernel modules have been disabled successfully."


      # ============================================================
      # 11. Verify that unrelated kernel modules are NOT selected
      #     FIXED: Check for ANY kernel modules, not just rtl8366-smi
      # ============================================================

      - name: Verify minimal package configuration
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          # Check if any kernel module is selected
          if grep -q '^CONFIG_PACKAGE_kmod-' .config; then
            echo "ERROR: Kernel modules are still selected:"
            grep '^CONFIG_PACKAGE_kmod-' .config
            exit 1
          fi

          if grep -q '^CONFIG_ALL_KMODS=y' .config; then
            echo "ERROR: CONFIG_ALL_KMODS=y"
            exit 1
          fi

          if grep -q '^CONFIG_ALL_NONSHARED=y' .config; then
            echo "ERROR: CONFIG_ALL_NONSHARED=y"
            exit 1
          fi

          # Verify our target package is set to build as module
          if ! grep -q '^CONFIG_PACKAGE_luci-app-tencentddns=m' .config; then
            echo "ERROR: CONFIG_PACKAGE_luci-app-tencentddns is not set to 'm'"
            grep '^CONFIG_PACKAGE_luci-app-tencentddns' .config || echo "Not found"
            exit 1
          fi

          echo "✓ Minimal package configuration verified successfully."
          echo "  - No kernel modules selected"
          echo "  - Target package configured as module"


      # ============================================================
      # 12. Build only TencentCloud DDNS
      # ============================================================

      - name: Build TencentCloud DDNS
        working-directory: sdk
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Building ${PACKAGE_NAME}"
          echo "============================================================"

          make \
            package/${PACKAGE_DIR}/{clean,compile} \
            V=s \
            -j"$(nproc)"


      # ============================================================
      # 13. Find APK
      # ============================================================

      - name: Find generated APK
        shell: bash
        run: |
          set -eux

          echo "============================================================"
          echo "Generated APK files"
          echo "============================================================"

          find \
            "$GITHUB_WORKSPACE/sdk/bin" \
            -type f \
            -name "*.apk" \
            -print \
            | sort

          echo
          echo "TencentCloud DDNS:"

          find \
            "$GITHUB_WORKSPACE/sdk/bin" \
            -type f \
            -name "${PACKAGE_NAME}_*.apk" \
            -print \
            | sort


      # ============================================================
      # 14. Collect APK
      # ============================================================

      - name: Collect APK
        shell: bash
        run: |
          set -eux

          mkdir -p "$GITHUB_WORKSPACE/dist"

          mapfile -t APK_FILES < <(
            find \
              "$GITHUB_WORKSPACE/sdk/bin" \
              -type f \
              -name "${PACKAGE_NAME}_*.apk"
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No TencentCloud DDNS APK generated."

            echo
            echo "All package files:"

            find \
              "$GITHUB_WORKSPACE/sdk/bin" \
              -type f \
              | sort

            exit 1
          fi

          for apk in "${APK_FILES[@]}"; do
            cp "$apk" "$GITHUB_WORKSPACE/dist/"
          done

          sha256sum \
            "$GITHUB_WORKSPACE/dist/"*.apk \
            > "$GITHUB_WORKSPACE/dist/SHA256SUMS"

          echo "============================================================"
          echo "Final artifact"
          echo "============================================================"

          ls -lh "$GITHUB_WORKSPACE/dist"

          file "$GITHUB_WORKSPACE/dist/"*.apk


      # ============================================================
      # 15. Upload artifact
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tencentcloud-ddns-openwrt-25.12.5
          path: dist/
          if-no-files-found: error


      # ============================================================
      # 16. GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openwrt-25.12.5-build-${{ github.run_number }}
          name: TencentCloud DDNS APK - OpenWrt 25.12.5 build ${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS
