name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl zstd \
          python3-pyelftools python3-pip swig

    - name: 精确下载并解压官方 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8"
        
        # 1. 下载官方校验码文件
        curl -sL "$BASE_URL/sha256sums" -o sha256sums
        
        # 2. 全格式正则提取 SDK 文件名 (支持 .tar.xz, .tar.zst, .tar.gz, .tar.bz2)
        SDK_FILE=$(grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|zst|gz|bz2)' sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "::error::未能在 sha256sums 中解析到 SDK！"
          cat sha256sums
          exit 1
        fi

        echo "成功定位 SDK 文件: $SDK_FILE"
        SDK_URL="$BASE_URL/$SDK_FILE"

        # 3. 下载 SDK 压缩包
        curl -fL -A "Mozilla/5.0" "$SDK_URL" -o openwrt-sdk.archive

        # 4. 根据实际压缩类型自动解压
        mkdir -p sdk
        if [[ "$SDK_FILE" == *.tar.zst ]]; then
          tar --zstd -xf openwrt-sdk.archive -C sdk --strip-components=1
        elif [[ "$SDK_FILE" == *.tar.xz ]]; then
          tar -xJf openwrt-sdk.archive -C sdk --strip-components=1
        else
          tar -xzf openwrt-sdk.archive -C sdk --strip-components=1
        fi

        rm openwrt-sdk.archive sha256sums

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        
        # 创建自定义 package 目录
        mkdir -p package/tencentcloud-ddns
        
        # 复制插件源码，排除不必要的目录
        rsync -av --exclude='sdk' --exclude='.git' --exclude='.github' ../ package/tencentcloud-ddns/
        
        # 更新 feeds 依赖
        ./scripts/feeds update -a
        ./scripts/feeds install -p packages -p luci

    - name: 动态解析包名并编译 (.apk)
      run: |
        cd sdk
        
        # 自动提取 Makefile 中的真实的 PKG_NAME (如 luci-app-tencentcloud-ddns 或 tencentcloud-ddns)
        PKG_NAME=$(grep -E '^PKG_NAME:=' package/tencentcloud-ddns/Makefile | cut -d'=' -f2 | tr -d ' \r\n')
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME="tencentcloud-ddns"
        fi
        echo "识别到的插件包名称 PKG_NAME = $PKG_NAME"

        # 重新生成默认配置
        make defconfig
        
        # 在 .config 中将该包勾选为模块编译 (m)
        echo "CONFIG_PACKAGE_$PKG_NAME=m" >> .config
        make defconfig
        
        # 编译插件 (同时兼容直接文件夹路径和 PKG_NAME)
        make package/tencentcloud-ddns/compile V=s -j$(nproc) || make package/$PKG_NAME/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-rockchip-armv8-apk
        path: |
          sdk/bin/packages/**/*.apk
          sdk/bin/targets/**/*.apk
