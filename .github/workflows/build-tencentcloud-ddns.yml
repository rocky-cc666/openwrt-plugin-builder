name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}-${{ matrix.subtarget }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 适用于 NanoPi R2S (RK3328) 与 E20C 等 Rockchip ARMv8 设备 (.apk 格式支持)
          - target: rockchip
            subtarget: armv8

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl jq

    - name: 下载并解压 OpenWrt SDK (.apk 兼容版)
      run: |
        # 使用 OpenWrt 官方 JSON API 获取最新可用 SDK 的真实绝对路径
        API_URL="https://firmware-selector.openwrt.org/api/v1/builds/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
        
        SDK_URL=$(curl -sL "$API_URL" | jq -r '.sdk_url // empty')

        # 防护后备逻辑：若 API 未返回，直接回退到 24.10 架构 SDK
        if [ -z "$SDK_URL" ] || [ "$SDK_URL" = "null" ]; then
          echo "API 获取失败，使用稳定版 24.10 SDK 路径..."
          SDK_URL="https://downloads.openwrt.org/releases/24.10.0/targets/${{ matrix.target }}/${{ matrix.subtarget }}/openwrt-sdk-24.10.0-${{ matrix.target }}-${{ matrix.subtarget }}_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
        fi

        echo "最终 SDK 下载地址: $SDK_URL"
        
        # 下载并解压 SDK
        wget -q -U "Mozilla/5.0" "$SDK_URL" -O openwrt-sdk.tar.xz
        mkdir -p sdk
        tar -xJf openwrt-sdk.tar.xz -C sdk --strip-components=1
        rm openwrt-sdk.tar.xz

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        # 将当前仓库的插件源码复制到 package 目录
        mkdir -p package/tencentcloud-ddns
        cp -r ../* package/tencentcloud-ddns/ 2>/dev/null || true
        
        # 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        make defconfig
        # 编译生成 apk 格式的安装包
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-${{ matrix.target }}-${{ matrix.subtarget }}-apk
        # 匹配编译出来的 .apk 格式文件
        path: sdk/bin/packages/${{ matrix.target }}/base/*.apk
