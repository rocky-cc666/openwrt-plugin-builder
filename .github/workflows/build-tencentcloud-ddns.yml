name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}-${{ matrix.subtarget }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 适用于 NanoPi R2S (RK3328) 与 E20C 等 Rockchip ARMv8 设备
          - target: rockchip
            subtarget: armv8

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 自动配置 OpenWrt SDK
      uses: openwrt/gh-action-sdk@v1
      with:
        arch: ${{ matrix.target }}-${{ matrix.subtarget }}
        # 使用支持 .apk 包格式的最新开发分支/主干版本
        ver: SNAPSHOT

    - name: 编译插件 (.apk)
      run: |
        # 将当前插件源码复制到 SDK 的 package 目录内
        mkdir -p bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}
        cp -r $GITHUB_WORKSPACE package/tencentcloud-ddns

        # 编译包
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-${{ matrix.target }}-${{ matrix.subtarget }}-apk
        # 上传生成的 .apk 格式安装包
        path: bin/packages/${{ matrix.target }}/base/*.apk
