name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}-${{ matrix.subtarget }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 适用于 NanoPi R2S (RK3328) 与 E20C 等 Rockchip ARMv8 设备
          - target: rockchip
            subtarget: armv8
            target_url: https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools python3-pip rsync unzip zlib1g-dev curl

    - name: 动态获取并解压 OpenWrt SDK
      run: |
        # 抓取包含所有版本的 json 索引或直接跟进 302 重定向
        SDK_URL=$(python3 -c "
        import urllib.request, json, re
        
        url = '${{ matrix.target_url }}'
        # 优先解析 OpenWrt 官方提供的 json 配置文件
        try:
            req = urllib.request.Request(url + 'profiles.json', headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as resp:
                data = json.loads(resp.read().decode())
                # 从 json 中获取精准下载路径
                print(url + 'openwrt-sdk-' + data['version_code'] + '-rockchip-armv8_gcc-' + data.get('gcc', '13.3.0') + '_musl.Linux-x86_64.tar.xz')
        except Exception:
            # 备用方案：跟进重定向抓取页面
            req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
            with urllib.request.urlopen(req) as resp:
                html = resp.read().decode('utf-8', errors='ignore')
                match = re.search(r'openwrt-sdk-[^\"]*?\.tar\.(xz|bz2|gz)', html)
                if match:
                    print(url + match.group(0))
        ")

        if [ -z "$SDK_URL" ]; then
          echo "错误：无法获取 SDK 地址！"
          exit 1
        fi

        echo "正在下载 SDK: $SDK_URL"
        wget -q -U "Mozilla/5.0" "$SDK_URL" -O openwrt-sdk.tar.xz

        mkdir -p sdk
        tar -xJf openwrt-sdk.tar.xz -C sdk --strip-components=1
        rm openwrt-sdk.tar.xz

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        # 将当前仓库的插件源码复制到 package 目录
        mkdir -p package/tencentcloud-ddns
        cp -r ../* package/tencentcloud-ddns/ 2>/dev/null || true
        
        # 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        make defconfig
        # 编译生成 apk 格式的安装包
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-${{ matrix.target }}-${{ matrix.subtarget }}-apk
        # 匹配编译出来的 .apk 格式文件
        path: sdk/bin/packages/${{ matrix.target }}/base/*.apk
