name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for ${{ matrix.target }}-${{ matrix.subtarget }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # 适用于 NanoPi R2S (RK3328) 与 E20C 等 Rockchip ARMv8 设备
          - target: rockchip
            subtarget: armv8
            version: "25.12.5"

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl

    - name: 精确下载并解压 OpenWrt 25.12 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}/${{ matrix.subtarget }}"
        
        # 实时从官方 sha256sums 提取正确的 SDK 文件名
        SDK_FILE=$(curl -sL "$BASE_URL/sha256sums" | grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|bz2)' | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "错误：无法从官方 sha256sums 中解析到 SDK 文件名！"
          exit 1
        fi

        echo "正在下载 SDK: $BASE_URL/$SDK_FILE"
        curl -fL -A "Mozilla/5.0" "$BASE_URL/$SDK_FILE" -o openwrt-sdk.tar.xz

        mkdir -p sdk
        tar -xJf openwrt-sdk.tar.xz -C sdk --strip-components=1
        rm openwrt-sdk.tar.xz

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        # 将当前仓库的插件源码复制到 package 目录
        mkdir -p package/tencentcloud-ddns
        cp -r ../* package/tencentcloud-ddns/ 2>/dev/null || true
        
        # 更新并安装 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        make defconfig
        # 编译生成 apk 格式的安装包
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-${{ matrix.target }}-${{ matrix.subtarget }}-apk
        # 匹配编译出来的 .apk 格式文件
        path: sdk/bin/packages/${{ matrix.target }}/base/*.apk
