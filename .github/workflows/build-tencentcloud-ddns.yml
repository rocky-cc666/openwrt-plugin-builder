name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # 腾讯云官方 OpenWrt DDNS 插件仓库地址
  PLUGIN_URL: "https://github.com/Tencent-Cloud-Plugins/tencentcloud-openwrt-plugin-ddns.git"

jobs:
  build:
    name: Build for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 清理磁盘空间 (防止 No space left on device)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift
        docker image prune --all --force || true
        sudo apt-get clean
        df -h

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl zstd \
          python3-pyelftools python3-pip swig

    - name: 下载并解压官方 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8"
        
        curl -sL "$BASE_URL/sha256sums" -o sha256sums
        SDK_FILE=$(grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|zst|gz|bz2)' sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "::error::未能在 sha256sums 中解析到 SDK！"
          cat sha256sums
          exit 1
        fi

        echo "定位到 SDK 文件: $SDK_FILE"
        curl -fL -A "Mozilla/5.0" "$BASE_URL/$SDK_FILE" -o openwrt-sdk.archive

        mkdir -p sdk
        if [[ "$SDK_FILE" == *.tar.zst ]]; then
          tar --zstd -xf openwrt-sdk.archive -C sdk --strip-components=1
        elif [[ "$SDK_FILE" == *.tar.xz ]]; then
          tar -xJf openwrt-sdk.archive -C sdk --strip-components=1
        else
          tar -xzf openwrt-sdk.archive -C sdk --strip-components=1
        fi

        rm openwrt-sdk.archive sha256sums

    - name: 克隆或定位插件源码
      run: |
        # 1. 优先检查当前 WorkSpace 本身是否已包含 Makefile
        MAKEFILE_PATH=$(find "$GITHUB_WORKSPACE" -iname "makefile" -not -path "*/sdk/*" | head -n 1)

        if [ -z "$MAKEFILE_PATH" ]; then
          echo "本地未找到 Makefile，准备从远端克隆插件源码: $PLUGIN_URL"
          rm -rf plugin_src
          git clone --depth 1 "$PLUGIN_URL" plugin_src
          MAKEFILE_PATH=$(find "$GITHUB_WORKSPACE/plugin_src" -iname "makefile" | head -n 1)
        fi

        if [ -z "$MAKEFILE_PATH" ]; then
          echo "::error::未能找到有效的 Makefile，请确认仓库路径或 URL 是否正确！"
          exit 1
        fi

        SRC_DIR=$(dirname "$MAKEFILE_PATH")
        echo "定位到源码 Makefile 路径: $MAKEFILE_PATH"

        # 2. 解析 PKG_NAME
        PKG_NAME=$(grep -E '^PKG_NAME:=' "$MAKEFILE_PATH" | cut -d'=' -f2 | tr -d ' \r\n')
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME=$(grep -oE 'define Package/[a-zA-Z0-9_.-]+' "$MAKEFILE_PATH" | head -n 1 | cut -d'/' -f2)
        fi
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME="tencentcloud-ddns"
        fi

        echo "解析到的 OpenWrt 包名为: $PKG_NAME"
        echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

        # 3. 复制插件源码至 SDK 的 package 目录下
        TARGET_DIR="$GITHUB_WORKSPACE/sdk/package/$PKG_NAME"
        mkdir -p "$TARGET_DIR"
        rsync -av --exclude='sdk' --exclude='.git' --exclude='.github' "$SRC_DIR/" "$TARGET_DIR/"

    - name: 配置 SDK 并执行编译
      run: |
        cd "$GITHUB_WORKSPACE/sdk"
        ./scripts/feeds update -a
        ./scripts/feeds install -p packages -p luci

        make defconfig
        echo "CONFIG_PACKAGE_$PKG_NAME=m" >> .config
        make defconfig

        make package/$PKG_NAME/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-rockchip-armv8-apk
        path: |
          sdk/bin/packages/**/*.apk
          sdk/bin/targets/**/*.apk
