# .github/workflows/build-liquid-theme.yml
name: Build Liquid Theme for OpenWrt 25.12.5 (ARMv8)

on:
  workflow_dispatch:
    # 手动触发，你可以调整参数再编译
  # 如果你想每次推送代码都自动编译，可以取消下面注释
  # push:
  #   branches: [ "main", "master" ]

env:
  # 主题名称
  PACKAGE_NAME: luci-theme-liquid
  # 目标架构：R2S/E20C 都是 ARMv8
  TARGET_ARCH: armsr/armv8
  # OpenWrt 版本：25.12.5
  OPENWRT_VERSION: v25.12.5
  # 使用 APK 包格式
  USE_APK: "y"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检查代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # 2. 设置编译环境
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            ecj \
            fastjar \
            file \
            g++ \
            gawk \
            gettext \
            git \
            java-propose-classpath \
            libelf-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-pip \
            python3-venv \
            rsync \
            swig \
            time \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev

      # 3. 下载 OpenWrt 25.12.5 官方 SDK
      - name: Download OpenWrt SDK
        run: |
          # 构建下载 URL
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.xz"
          echo "Downloading SDK from: $SDK_URL"
          wget -q "$SDK_URL" -O sdk.tar.xz
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk
          echo "SDK downloaded and extracted"

      # 4. 准备 feeds（软件源）
      - name: Update feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "Feeds updated"

      # 5. 将主题源码放入编译目录
      - name: Copy theme source to package directory
        run: |
          # 如果当前仓库根目录就有主题源码文件夹，直接复制
          if [ -d "${{ env.PACKAGE_NAME }}" ]; then
            cp -r ${{ env.PACKAGE_NAME }} openwrt-sdk/package/
          else
            # 否则从 GitHub 克隆最新源码
            cd openwrt-sdk/package
            git clone https://github.com/zzsj0928/luci-theme-liquid.git
          fi
          echo "Theme source prepared"

      # 6. 配置编译（只编译指定包）
      - name: Configure build
        run: |
          cd openwrt-sdk
          # 创建最小化配置，只编译我们的包
          echo "CONFIG_TARGET_armsr=y" > .config
          echo "CONFIG_TARGET_armsr_armv8=y" >> .config
          echo "CONFIG_TARGET_armsr_armv8_DEVICE_generic=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-liquid=y" >> .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          echo "CONFIG_ALL_NONSHARED=n" >> .config
          # 确保生成 .apk 包
          echo "CONFIG_USE_APK=y" >> .config
          # 禁用不必要的选项以加速编译
          echo "CONFIG_IMAGEOPT=n" >> .config
          echo "CONFIG_TARGET_IMAGES_GZIP=n" >> .config
          make defconfig
          echo "Configuration complete"

      # 7. 编译主题
      - name: Compile theme package
        run: |
          cd openwrt-sdk
          # 只编译指定的包，-j$(nproc) 使用所有 CPU 核心
          make package/luci-theme-liquid/compile -j$(nproc) V=s
          echo "Compilation finished"

      # 8. 查找并准备编译产物
      - name: Collect artifacts
        run: |
          # 查找所有 .apk 文件（包含新格式）
          find openwrt-sdk -name "*.apk" -type f -exec cp {} ./ \;
          # 如果找不到 .apk，尝试查找 .ipk（兼容回退）
          find openwrt-sdk -name "*.ipk" -type f -exec cp {} ./ \;
          # 列出找到的文件
          ls -la *.apk 2>/dev/null || ls -la *.ipk 2>/dev/null
          echo "Artifacts collected"

      # 9. 上传编译产物（作为 Actions 的下载文件）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liquid-theme-25.12.5-armv8
          path: |
            *.apk
            *.ipk
          retention-days: 30
          compression-level: 0
