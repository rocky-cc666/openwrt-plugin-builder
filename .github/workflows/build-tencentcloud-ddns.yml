name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  PLUGIN_URL: "https://github.com/Tencent-Cloud-Plugins/tencentcloud-openwrt-plugin-ddns.git"

jobs:
  build:
    name: Build for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 清理磁盘空间 (防止 No space left on device)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift
        docker image prune --all --force || true
        sudo apt-get clean
        df -h

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl zstd \
          python3-pyelftools python3-pip swig

    - name: 下载并解压官方 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8"
        
        curl -sL "$BASE_URL/sha256sums" -o sha256sums
        SDK_FILE=$(grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|zst|gz|bz2)' sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "::error::未能在 sha256sums 中解析到 SDK！"
          cat sha256sums
          exit 1
        fi

        echo "定位到 SDK 文件: $SDK_FILE"
        curl -fL -A "Mozilla/5.0" "$BASE_URL/$SDK_FILE" -o openwrt-sdk.archive

        mkdir -p sdk
        if [[ "$SDK_FILE" == *.tar.zst ]]; then
          tar --zstd -xf openwrt-sdk.archive -C sdk --strip-components=1
        elif [[ "$SDK_FILE" == *.tar.xz ]]; then
          tar -xJf openwrt-sdk.archive -C sdk --strip-components=1
        else
          tar -xzf openwrt-sdk.archive -C sdk --strip-components=1
        fi

        rm openwrt-sdk.archive sha256sums

    - name: 克隆腾讯云官方插件源码
      run: |
        rm -rf plugin_src
        git clone --depth 1 "$PLUGIN_URL" plugin_src

        # 腾讯云官方项目的结构中，Makefile 位于 tencentcloud_ddns 文件夹内
        MAKEFILE_PATH=$(find "$GITHUB_WORKSPACE/plugin_src" -iname "makefile" -not -path "*/tools/*" | head -n 1)

        if [ -z "$MAKEFILE_PATH" ]; then
          echo "::error::未能找到有效的 Makefile，请确认仓库路径！"
          exit 1
        fi

        SRC_DIR=$(dirname "$MAKEFILE_PATH")
        echo "定位到源码目录: $SRC_DIR"

        # 解析真正的包名 (luci-app-tencentddns)
        PKG_NAME=$(grep -E '^PKG_NAME:=' "$MAKEFILE_PATH" | cut -d'=' -f2 | tr -d ' \r\n')
        if [ -z "$PKG_NAME" ]; then
          PKG_NAME=$(grep -oE 'define Package/[a-zA-Z0-9_.-]+' "$MAKEFILE_PATH" | head -n 1 | cut -d'/' -f2)
        fi

        echo "解析到的 OpenWrt 包名为: $PKG_NAME"
        echo "PKG_NAME=$PKG_NAME" >> $GITHUB_ENV

        # 同步整个插件目录到 SDK 的 package 目录下
        TARGET_DIR="$GITHUB_WORKSPACE/sdk/package/$PKG_NAME"
        mkdir -p "$TARGET_DIR"
        rsync -av "$SRC_DIR/" "$TARGET_DIR/"

    - name: 准备 po2lmo 工具及 feeds 依赖
      run: |
        cd "$GITHUB_WORKSPACE/sdk"
        ./scripts/feeds update -a
        ./scripts/feeds install -p packages -p luci

        # 编译编译期依赖的 po2lmo 工具（解决多语言翻译转换）
        PO2LMO_DIR=$(find "$GITHUB_WORKSPACE/sdk/feeds" -type d -name "po2lmo" | head -n 1)
        if [ -n "$PO2LMO_DIR" ] && [ -d "$PO2LMO_DIR/src" ]; then
          gcc -O2 "$PO2LMO_DIR/src/po2lmo.c" "$PO2LMO_DIR/src/template.c" -o po2lmo
          sudo mv po2lmo /usr/local/bin/
        else
          # 防护补充机制：如没寻到源码，下载基准 po2lmo.c 现场编译
          mkdir -p /tmp/po2lmo_build && cd /tmp/po2lmo_build
          curl -sSL https://raw.githubusercontent.com/openwrt/luci/openwrt-23.05/modules/luci-base/src/po2lmo.c -o po2lmo.c
          curl -sSL https://raw.githubusercontent.com/openwrt/luci/openwrt-23.05/modules/luci-base/src/template.c -o template.c
          curl -sSL https://raw.githubusercontent.com/openwrt/luci/openwrt-23.05/modules/luci-base/src/template.h -o template.h
          gcc -O2 po2lmo.c template.c -o po2lmo
          sudo mv po2lmo /usr/local/bin/
        fi

        echo "验证 po2lmo 环境："
        which po2lmo

    - name: 配置 SDK 并执行编译
      run: |
        cd "$GITHUB_WORKSPACE/sdk"
        make defconfig
        echo "CONFIG_PACKAGE_$PKG_NAME=m" >> .config
        make defconfig

        # 编译目标包
        make package/$PKG_NAME/compile V=s -j$(nproc)

    - name: 整理并上传 apk/ipk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-rockchip-armv8-packages
        path: |
          sdk/bin/packages/**/*.apk
          sdk/bin/packages/**/*.ipk
          sdk/bin/targets/**/*.apk
          sdk/bin/targets/**/*.ipk
