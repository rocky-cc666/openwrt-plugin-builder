name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 允许在 GitHub 界面手动触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出当前仓库代码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev

    - name: 下载 OpenWrt SDK
      run: |
        # 根据你的路由器架构（如 x86_64, aarch64_cortex-a53 等）下载对应的 OpenWrt SDK 并解压
        wget https://downloads.openwrt.org/releases/23.05.0/targets/x86/64/openwrt-sdk-23.05.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        tar -xJf openwrt-sdk-*.tar.xz
        mv openwrt-sdk-* sdk

    - name: 编译插件
      run: |
        cd sdk
        # 将你的插件复制或链接到 SDK 的 package 目录下
        cp -r ../your-plugin-dir package/
        # 更新并安装 feed（如果需要依赖）
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        # 配置并编译指定包
        make defconfig
        make package/your-plugin-dir/compile V=s

    - name: 上传生成的 ipk 文件
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-plugin-ipk
        path: sdk/bin/packages/
