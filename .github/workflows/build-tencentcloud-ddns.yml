name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl zstd \
          python3-pyelftools python3-pip swig

    - name: 精确下载并解压官方 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8"
        
        # 1. 下载官方校验码文件
        curl -sL "$BASE_URL/sha256sums" -o sha256sums
        
        # 2. 全格式正则提取 SDK 文件名 (支持 .tar.xz, .tar.zst, .tar.gz, .tar.bz2)
        SDK_FILE=$(grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|zst|gz|bz2)' sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "::error::未能在 sha256sums 中解析到 SDK！"
          cat sha256sums
          exit 1
        fi

        echo "成功定位 SDK 文件: $SDK_FILE"
        SDK_URL="$BASE_URL/$SDK_FILE"

        # 3. 下载 SDK 压缩包
        curl -fL -A "Mozilla/5.0" "$SDK_URL" -o openwrt-sdk.archive

        # 4. 根据实际压缩类型自动解压
        mkdir -p sdk
        if [[ "$SDK_FILE" == *.tar.zst ]]; then
          tar --zstd -xf openwrt-sdk.archive -C sdk --strip-components=1
        elif [[ "$SDK_FILE" == *.tar.xz ]]; then
          tar -xJf openwrt-sdk.archive -C sdk --strip-components=1
        else
          tar -xzf openwrt-sdk.archive -C sdk --strip-components=1
        fi

        rm openwrt-sdk.archive sha256sums

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        
        # 1. 在当前项目中寻找包含 OpenWrt Makefile 的真实目录
        SRC_MAKEFILE_DIR=$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 3 -name "Makefile" -not -path "*/sdk/*" -exec dirname {} \; | head -n 1)
        
        if [ -z "$SRC_MAKEFILE_DIR" ]; then
          # 如果根目录下就是 Makefile
          SRC_MAKEFILE_DIR="$GITHUB_WORKSPACE"
        fi
        
        echo "定位到插件源码 Makefile 所在路径: $SRC_MAKEFILE_DIR"

        # 2. 将源码正确复制到 package/tencentcloud-ddns 目录
        mkdir -p package/tencentcloud-ddns
        rsync -av --exclude='sdk' --exclude='.git' --exclude='.github' "$SRC_MAKEFILE_DIR/" package/tencentcloud-ddns/

        echo "=== 检查 package/tencentcloud-ddns 目录结构 ==="
        ls -la package/tencentcloud-ddns/

        # 3. 更新并安装依赖 feeds
        ./scripts/feeds update -a
        ./scripts/feeds install -p packages -p luci

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        
        # 1. 从 Makefile 中提取标准的 OpenWrt Package Name (如 luci-app-tencentcloud-ddns)
        TARGET_PKG=$(grep -oE 'define Package/[a-zA-Z0-9_.-]+' package/tencentcloud-ddns/Makefile | head -n 1 | cut -d'/' -f2)
        
        if [ -z "$TARGET_PKG" ]; then
          TARGET_PKG=$(grep -E '^PKG_NAME:=' package/tencentcloud-ddns/Makefile | cut -d'=' -f2 | tr -d ' \r\n')
        fi
        
        if [ -z "$TARGET_PKG" ]; then
          TARGET_PKG="tencentcloud-ddns"
        fi

        echo "=== 确定 OpenWrt 编译目标包名: $TARGET_PKG ==="

        # 2. 生成默认配置并激活当前软件包
        make defconfig
        echo "CONFIG_PACKAGE_$TARGET_PKG=m" >> .config
        make defconfig

        # 3. 强制刷索引并编译
        make package/$TARGET_PKG/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-rockchip-armv8-apk
        path: |
          sdk/bin/packages/**/*.apk
          sdk/bin/targets/**/*.apk
