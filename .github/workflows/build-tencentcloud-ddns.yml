name: Build tencentcloud-ddns Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build for rockchip-armv8
    runs-on: ubuntu-latest

    steps:
    - name: 检出仓库源码
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison gawk gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev curl zstd \
          python3-pyelftools python3-pip swig

    - name: 精确下载并解压官方 SDK (.apk 格式)
      run: |
        BASE_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8"
        
        # 1. 下载官方校验码文件
        curl -sL "$BASE_URL/sha256sums" -o sha256sums
        
        # 2. 全格式正则提取 SDK 文件名 (支持 .tar.xz, .tar.zst, .tar.gz, .tar.bz2)
        SDK_FILE=$(grep -oE 'openwrt-sdk-[a-zA-Z0-9_.-]+\.tar\.(xz|zst|gz|bz2)' sha256sums | head -n 1)
        
        if [ -z "$SDK_FILE" ]; then
          echo "::error::未能在 sha256sums 中解析到 SDK！"
          cat sha256sums
          exit 1
        fi

        echo "成功定位 SDK 文件: $SDK_FILE"
        SDK_URL="$BASE_URL/$SDK_FILE"

        # 3. 下载 SDK 压缩包
        curl -fL -A "Mozilla/5.0" "$SDK_URL" -o openwrt-sdk.archive

        # 4. 根据实际压缩类型自动解压
        mkdir -p sdk
        if [[ "$SDK_FILE" == *.tar.zst ]]; then
          tar --zstd -xf openwrt-sdk.archive -C sdk --strip-components=1
        elif [[ "$SDK_FILE" == *.tar.xz ]]; then
          tar -xJf openwrt-sdk.archive -C sdk --strip-components=1
        else
          tar -xzf openwrt-archive -C sdk --strip-components=1
        fi

        rm openwrt-sdk.archive sha256sums

    - name: 载入插件源码与依赖
      run: |
        cd sdk
        # 将当前仓库的插件源码复制到 package 目录
        mkdir -p package/tencentcloud-ddns
        cp -r ../* package/tencentcloud-ddns/ 2>/dev/null || true
        
        # 更新 feeds
        ./scripts/feeds update -a
        
        # 只安装当前插件和基础需要的 feed，避免引入 uboot/perl 等非必要重编译项
        ./scripts/feeds install -p packages -p luci

    - name: 编译插件 (.apk)
      run: |
        cd sdk
        # 生成默认编译配置
        make defconfig
        
        # 单独编译 tencentcloud-ddns 插件
        make package/tencentcloud-ddns/compile V=s -j$(nproc)

    - name: 整理并上传 apk 安装包
      uses: actions/upload-artifact@v4
      with:
        name: tencentcloud-ddns-rockchip-armv8-apk
        # 匹配编译出来的 .apk 格式文件
        path: |
          sdk/bin/packages/rockchip/base/*.apk
          sdk/bin/targets/rockchip/armv8/packages/*.apk
