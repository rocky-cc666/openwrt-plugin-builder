name: Build OpenWrt NPS Plugin (APK) for 25.12.5

on:
  workflow_dispatch:
    inputs:
      npc_version:
        description: 'NPC Version'
        required: true
        default: '0.26.37'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - arch: "aarch64_generic"
            sdk_target: "rockchip/armv8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            python3 \
            python3-pip \
            file \
            git \
            unzip \
            wget \
            time \
            perl \
            rsync \
            bc \
            openssl \
            zlib1g-dev \
            libelf-dev

      - name: Build NPC APK Package for OpenWrt 25.12.5
        run: |
          set -e
          
          NPC_VER="${{ github.event.inputs.npc_version }}"
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"
          
          echo "NPC Version: ${NPC_VER}"
          echo "Working directory: ${WORK_DIR}"
          echo "Output directory: ${OUT_DIR}"
          
          # 1. 下载 ipkg-build 工具
          echo "=== 准备打包工具 ==="
          if [ ! -f /tmp/ipkg-build ]; then
            wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /tmp/ipkg-build
            chmod +x /tmp/ipkg-build
          fi
          
          # 2. 下载 NPC 客户端
          echo "=== 下载 NPC 客户端 v${NPC_VER} ==="
          NPC_DOWNLOADED=false
          
          DOWNLOAD_URLS=(
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz"
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/arm64_client.tar.gz"
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_musl_client.tar.gz"
          )
          
          for URL in "${DOWNLOAD_URLS[@]}"; do
            echo "尝试下载: ${URL}"
            if wget -q --spider "$URL" 2>/dev/null; then
              if wget -q -L "$URL" -O npc_client.tar.gz; then
                echo "✅ 下载成功"
                NPC_DOWNLOADED=true
                break
              fi
            fi
          done
          
          # 如果直接下载失败，尝试使用代理
          if [ "$NPC_DOWNLOADED" = false ]; then
            echo "尝试使用代理下载..."
            for URL in "${DOWNLOAD_URLS[@]}"; do
              PROXY_URL="https://ghproxy.net/${URL}"
              echo "尝试代理: ${PROXY_URL}"
              if wget -q "$PROXY_URL" -O npc_client.tar.gz; then
                echo "✅ 代理下载成功"
                NPC_DOWNLOADED=true
                break
              fi
            done
          fi
          
          if [ "$NPC_DOWNLOADED" = false ]; then
            echo "❌ 所有下载源均失败"
            exit 1
          fi
          
          echo "解压 NPC 客户端..."
          mkdir -p npc_extract
          tar -xzf npc_client.tar.gz -C npc_extract/ 2>/dev/null || {
            echo "⚠️  第一次解压失败，尝试强制解压"
            tar -xzf npc_client.tar.gz -C npc_extract/ --force-local 2>/dev/null || {
              echo "❌ 解压失败"
              exit 1
            }
          }
          
          # 查找 npc 二进制文件
          NPC_BIN=$(find npc_extract -name "npc" -type f 2>/dev/null | head -n1)
          if [ -z "$NPC_BIN" ]; then
            echo "❌ 未找到 NPC 可执行文件"
            exit 1
          fi
          echo "找到 NPC 二进制: ${NPC_BIN}"
          
          # 3. 创建 NPC APK 包
          echo "=== 创建 NPC APK 包 ==="
          mkdir -p ipk_npc/CONTROL ipk_npc/usr/bin ipk_npc/etc/npc
          
          # 复制二进制文件
          cp "$NPC_BIN" ipk_npc/usr/bin/
          chmod 755 ipk_npc/usr/bin/npc
          
          # 复制配置文件（如果存在）
          CONF_DIR=$(find npc_extract -name "conf" -type d 2>/dev/null | head -n1)
          if [ -n "$CONF_DIR" ] && [ -d "$CONF_DIR" ]; then
            cp -r "$CONF_DIR"/* ipk_npc/etc/npc/ 2>/dev/null || true
          fi
          
          # 创建默认配置文件
          cat << 'EOF' > ipk_npc/etc/npc/npc.conf
          # NPC 默认配置文件
          server_addr=127.0.0.1:8024
          conn_key=1234567890
          log_level=3
          log_path=/var/log/npc.log
          client_id=
          timeout=10
          auto_reconnect=30
          EOF
          
          # 创建 control 文件
          cat << EOF > ipk_npc/CONTROL/control
          Package: npc
          Version: ${NPC_VER}-r1
          Depends: libc, kmod-tun
          Source: https://github.com/yisier/nps
          License: GPL-3.0
          Section: net
          Architecture: aarch64_generic
          Maintainer: OpenWrt Team
          Description: NPS Client (npc) - 内网穿透客户端
          EOF
          
          # 创建 postinst 脚本
          cat << 'EOF' > ipk_npc/CONTROL/postinst
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
            mkdir -p /var/log/npc
            mkdir -p /etc/npc
            chmod 755 /usr/bin/npc
            chmod 644 /etc/npc/npc.conf
            if [ -f /etc/init.d/npc ]; then
              /etc/init.d/npc enable
            fi
          }
          exit 0
          EOF
          chmod 755 ipk_npc/CONTROL/postinst
          
          # 创建 prerm 脚本
          cat << 'EOF' > ipk_npc/CONTROL/prerm
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
            if [ -f /etc/init.d/npc ]; then
              /etc/init.d/npc stop
              /etc/init.d/npc disable
            fi
          }
          exit 0
          EOF
          chmod 755 ipk_npc/CONTROL/prerm
          
          # 4. 创建 init.d 启动脚本
          mkdir -p ipk_npc/etc/init.d
          cat << 'EOF' > ipk_npc/etc/init.d/npc
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1
          
          NPC_BIN="/usr/bin/npc"
          NPC_CONF="/etc/npc/npc.conf"
          PID_FILE="/var/run/npc.pid"
          
          start_service() {
            procd_open_instance
            procd_set_param command "$NPC_BIN" -config="$NPC_CONF"
            procd_set_param respawn 3600 5 0
            procd_set_param pidfile "$PID_FILE"
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
          }
          
          stop_service() {
            killall npc 2>/dev/null
          }
          EOF
          chmod 755 ipk_npc/etc/init.d/npc
          
          # 5. 打包 NPC (使用 ipkg-build)
          echo "=== 打包 NPC APK ==="
          # 先尝试使用 ipkg-build
          /tmp/ipkg-build -o root -g root ipk_npc "$OUT_DIR" 2>/dev/null || {
            echo "⚠️  ipkg-build 打包失败，尝试手动打包"
            # 手动打包：先进入目录，再打包
            PKG_NAME="npc_${NPC_VER}-r1_aarch64_generic.apk"
            cd ipk_npc
            tar -czf "../${OUT_DIR}/${PKG_NAME}" ./*
            cd ..
            echo "✅ 手动打包完成: ${PKG_NAME}"
          }
          
          # 检查打包结果
          if ls "${OUT_DIR}"/npc_*.apk 1> /dev/null 2>&1; then
            echo "✅ NPC 包打包成功"
          else
            echo "❌ NPC 包打包失败"
            exit 1
          fi
          
          # 6. 创建 LuCI 界面包
          echo "=== 创建 LuCI APP APK ==="
          mkdir -p ipk_luci/CONTROL
          mkdir -p ipk_luci/usr/lib/lua/luci/controller/npc
          mkdir -p ipk_luci/usr/lib/lua/luci/model/cbi/npc
          mkdir -p ipk_luci/usr/share/rpcd/acl.d
          mkdir -p ipk_luci/usr/share/luci/menu.d
          
          # control 文件
          cat << EOF > ipk_luci/CONTROL/control
          Package: luci-app-npc
          Version: 1.0.0-r1
          Depends: npc, luci-base
          Architecture: all
          Maintainer: OpenWrt Team
          Description: LuCI interface for NPC - NPS Client
          EOF
          
          # 创建 LuCI 控制器
          cat << 'EOF' > ipk_luci/usr/lib/lua/luci/controller/npc/overview.lua
          module("luci.controller.npc.overview", package.seeall)
          
          function index()
            if not nixio.fs.access("/usr/bin/npc") then
              return
            end
            
            entry({"admin", "services", "npc"}, 
                  cbi("npc/overview"), 
                  "NPS Client", 
                  30)
          end
          EOF
          
          # 创建 CBI 配置页面
          cat << 'EOF' > ipk_luci/usr/lib/lua/luci/model/cbi/npc/overview.lua
          local m, s, o
          
          m = Map("npc", "NPS Client Configuration")
          
          s = m:section(TypedSection, "general", "General Settings")
          s.anonymous = true
          
          o = s:option(Value, "server_addr", "Server Address")
          o.default = "127.0.0.1:8024"
          o.rmempty = false
          
          o = s:option(Value, "conn_key", "Connection Key")
          o.password = true
          o.rmempty = false
          
          o = s:option(ListValue, "log_level", "Log Level")
          o:value("0", "None")
          o:value("3", "Info")
          o:value("4", "Debug")
          o.default = "3"
          
          return m
          EOF
          
          # ACL 权限配置
          cat << 'EOF' > ipk_luci/usr/share/rpcd/acl.d/luci-app-npc.json
          {
            "luci-app-npc": {
              "description": "Grant access to NPC configuration",
              "read": {
                "file": {
                  "/etc/npc/npc.conf": [ "read" ]
                }
              },
              "write": {
                "file": {
                  "/etc/npc/npc.conf": [ "write" ]
                }
              }
            }
          }
          EOF
          
          # 菜单配置
          cat << 'EOF' > ipk_luci/usr/share/luci/menu.d/luci-app-npc.json
          {
            "admin/services/npc": {
              "title": "NPS Client",
              "action": {
                "type": "view",
                "path": "npc/overview"
              }
            }
          }
          EOF
          
          # 打包 LuCI
          echo "打包 LuCI APP..."
          /tmp/ipkg-build -o root -g root ipk_luci "$OUT_DIR" 2>/dev/null || {
            echo "⚠️  ipkg-build 打包失败，尝试手动打包"
            PKG_NAME="luci-app-npc_1.0.0-r1_all.apk"
            cd ipk_luci
            tar -czf "../${OUT_DIR}/${PKG_NAME}" ./*
            cd ..
            echo "✅ 手动打包完成: ${PKG_NAME}"
          }
          
          # 检查打包结果
          if ls "${OUT_DIR}"/luci-app-npc_*.apk 1> /dev/null 2>&1; then
            echo "✅ LuCI 包打包成功"
          else
            echo "❌ LuCI 包打包失败"
            exit 1
          fi
          
          # 清理临时文件
          rm -rf ipk_npc ipk_luci npc_extract npc_client.tar.gz 2>/dev/null || true
          
          echo "=== 构建完成 ==="
          echo "生成的文件:"
          ls -la "${OUT_DIR}"/

      - name: List Built Packages
        run: |
          echo "## 📦 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 包名 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d output ]; then
            for pkg in output/*; do
              if [ -f "$pkg" ]; then
                size=$(du -h "$pkg" | cut -f1)
                echo "| $(basename $pkg) | $size |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "| 未找到构建产物 | - |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📝 安装说明" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装命令" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# 上传文件到路由器" >> $GITHUB_STEP_SUMMARY
          echo "scp output/*.apk root@192.168.1.1:/tmp/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 安装 NPC" >> $GITHUB_STEP_SUMMARY
          echo "apk add --allow-untrusted /tmp/npc_*.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 安装 LuCI 界面" >> $GITHUB_STEP_SUMMARY
          echo "apk add --allow-untrusted /tmp/luci-app-npc_*.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# 启动服务" >> $GITHUB_STEP_SUMMARY
          echo "/etc/init.d/npc start" >> $GITHUB_STEP_SUMMARY
          echo "/etc/init.d/npc enable" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-npc-v${{ github.event.inputs.npc_version }}-for-r2s-e20c
          path: output/*
          retention-days: 30
