name: Build OpenWrt NPS Plugin (APK) for 25.12.5

on:
  workflow_dispatch:
    inputs:
      npc_version:
        description: 'NPC Version'
        required: true
        default: '0.26.37'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - arch: "aarch64_generic"
            sdk_target: "rockchip/armv8"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libncurses-dev \
            python3 \
            python3-pip \
            file \
            git \
            unzip \
            wget \
            time \
            perl \
            rsync \
            bc \
            openssl \
            zlib1g-dev \
            libelf-dev \
            lz4 \
            zstd

      - name: Build NPC APK Package for OpenWrt 25.12.5
        run: |
          NPC_VER="${{ github.event.inputs.npc_version }}"
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"
          
          echo "NPC Version: ${NPC_VER}"
          echo "Working directory: ${WORK_DIR}"
          
          # 1. 尝试下载 OpenWrt 25.12.5 官方 SDK
          echo "=== 下载 OpenWrt SDK ==="
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/rockchip/armv8/openwrt-sdk-25.12.5-rockchip-armv8_gcc-13.3.0_glibc.Linux-x86_64.tar.xz"
          SDK_BACKUP_URL="https://downloads.openwrt.org/snapshots/targets/rockchip/armv8/openwrt-sdk-rockchip-armv8_gcc-13.3.0_glibc.Linux-x86_64.tar.xz"
          
          if wget -q --spider "$SDK_URL"; then
            echo "下载正式版 SDK..."
            wget -q "$SDK_URL" -O sdk.tar.xz
          else
            echo "正式版 SDK 不可用，尝试下载快照版..."
            wget -q "$SDK_BACKUP_URL" -O sdk.tar.xz
          fi
          
          if [ -f sdk.tar.xz ]; then
            echo "SDK 下载成功，解压中..."
            tar -xf sdk.tar.xz
            SDK_DIR=$(ls -d openwrt-sdk-* 2>/dev/null | head -n1)
            echo "SDK 目录: ${SDK_DIR}"
            
            if [ -d "${SDK_DIR}" ]; then
              # 使用 SDK 中的打包工具
              IPKG_BUILD="${SDK_DIR}/staging_dir/host/bin/ipkg-build"
              echo "使用 SDK 打包工具: ${IPKG_BUILD}"
              export PATH="${SDK_DIR}/staging_dir/host/bin:${PATH}"
            else
              echo "未找到 SDK 目录，将使用系统工具"
              IPKG_BUILD=""
            fi
          else
            echo "SDK 下载失败，将使用系统工具"
            IPKG_BUILD=""
          fi

          # 2. 下载 NPC 客户端 (多个备选源)
          echo "=== 下载 NPC 客户端 ==="
          NPC_FOUND=false
          DOWNLOAD_URLS=(
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz"
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/arm64_client.tar.gz"
            "https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_musl_client.tar.gz"
            "https://github.com/ehang-io/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz"
            "https://github.com/cnlh/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz"
          )
          
          for URL in "${DOWNLOAD_URLS[@]}"; do
            echo "尝试下载: ${URL}"
            if wget -q --spider "$URL"; then
              if wget -q -L "$URL" -O npc_client.tar.gz; then
                echo "✅ 下载成功: ${URL}"
                NPC_FOUND=true
                break
              fi
            fi
          done
          
          if [ "$NPC_FOUND" = false ]; then
            echo "❌ 所有下载源均失败，尝试使用备用方案"
            # 尝试从其他镜像下载
            wget -q "https://ghproxy.net/https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz" -O npc_client.tar.gz || {
              echo "❌ 下载失败，退出"
              exit 1
            }
          fi
          
          echo "解压 NPC 客户端..."
          mkdir -p npc_extract
          tar -xzf npc_client.tar.gz -C npc_extract/ 2>/dev/null || {
            echo "解压失败，尝试使用 -xzf 选项"
            tar -xzf npc_client.tar.gz -C npc_extract/
          }
          
          if [ ! -f npc_extract/npc ] && [ -f npc_extract/linux_arm64/npc ]; then
            # 某些版本可能嵌套在子目录中
            cp npc_extract/linux_arm64/npc npc_extract/npc
          fi
          
          if [ ! -f npc_extract/npc ]; then
            echo "❌ 未找到 NPC 可执行文件"
            exit 1
          fi

          # 3. 创建 APK 包结构
          echo "=== 创建 NPC APK 包 ==="
          mkdir -p ipk_npc/CONTROL ipk_npc/usr/bin ipk_npc/etc/npc ipk_npc/usr/lib
          
          # 复制二进制文件
          cp npc_extract/npc ipk_npc/usr/bin/
          chmod 755 ipk_npc/usr/bin/npc
          
          # 复制配置文件
          if [ -d npc_extract/conf ]; then
            cp -r npc_extract/conf/* ipk_npc/etc/npc/ || true
          fi

          # 创建默认配置文件
          cat << 'EOF' > ipk_npc/etc/npc/npc.conf
          # NPC 默认配置文件
          server_addr=127.0.0.1:8024
          conn_key=1234567890
          log_level=3
          log_path=/var/log/npc.log
          client_id=
          timeout=10
          auto_reconnect=30
          EOF

          # 生成 control 文件
          cat << EOF > ipk_npc/CONTROL/control
          Package: npc
          Version: ${NPC_VER}-r1
          Depends: libc, kmod-tun
          Source: https://github.com/yisier/nps
          License: GPL-3.0
          Section: net
          Architecture: aarch64_generic
          Maintainer: OpenWrt Team
          Description: NPS Client (npc) - 内网穿透客户端
          专为 OpenWrt 25.12.5 优化
          EOF

          # 创建 postinst 脚本
          cat << 'EOF' > ipk_npc/CONTROL/postinst
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
            mkdir -p /var/log/npc
            mkdir -p /etc/npc
            chmod 755 /usr/bin/npc
            chmod 644 /etc/npc/npc.conf
            if [ -f /etc/init.d/npc ]; then
              /etc/init.d/npc enable
            fi
          }
          exit 0
          EOF
          chmod 755 ipk_npc/CONTROL/postinst

          # 创建 prerm 脚本
          cat << 'EOF' > ipk_npc/CONTROL/prerm
          #!/bin/sh
          [ -n "${IPKG_INSTROOT}" ] || {
            if [ -f /etc/init.d/npc ]; then
              /etc/init.d/npc stop
              /etc/init.d/npc disable
            fi
          }
          exit 0
          EOF
          chmod 755 ipk_npc/CONTROL/prerm

          # 4. 创建 init.d 启动脚本
          mkdir -p ipk_npc/etc/init.d
          cat << 'EOF' > ipk_npc/etc/init.d/npc
          #!/bin/sh /etc/rc.common
          START=99
          STOP=10
          USE_PROCD=1
          
          NPC_BIN="/usr/bin/npc"
          NPC_CONF="/etc/npc/npc.conf"
          PID_FILE="/var/run/npc.pid"
          
          start_service() {
            procd_open_instance
            procd_set_param command "$NPC_BIN" -config="$NPC_CONF"
            procd_set_param respawn 3600 5 0
            procd_set_param pidfile "$PID_FILE"
            procd_set_param stdout 1
            procd_set_param stderr 1
            procd_close_instance
          }
          
          stop_service() {
            killall npc 2>/dev/null
          }
          EOF
          chmod 755 ipk_npc/etc/init.d/npc

          # 5. 打包为 APK
          echo "=== 打包 NPC APK ==="
          PACKAGE_NAME="npc_${NPC_VER}-r1_aarch64_generic.apk"
          
          # 使用 ipkg-build 或手动打包
          if [ -n "${IPKG_BUILD}" ] && [ -f "${IPKG_BUILD}" ]; then
            echo "使用 SDK 的 ipkg-build 打包..."
            "${IPKG_BUILD}" -o root -g root ipk_npc "$OUT_DIR"
          else
            echo "使用系统工具打包..."
            # 下载并准备 ipkg-build
            if [ ! -f /tmp/ipkg-build ]; then
              wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /tmp/ipkg-build
              chmod +x /tmp/ipkg-build
            fi
            /tmp/ipkg-build -o root -g root ipk_npc "$OUT_DIR" 2>/dev/null || {
              echo "ipkg-build 失败，尝试手动打包..."
              # 手动创建 APK 包 (tar.gz 格式)
              cd ipk_npc
              tar -czf "../${OUT_DIR}/${PACKAGE_NAME}" *
              cd ..
            }
          fi
          
          # 6. 创建 LuCI 界面包
          echo "=== 创建 LuCI APP APK ==="
          mkdir -p ipk_luci/CONTROL
          mkdir -p ipk_luci/usr/lib/lua/luci/controller/npc
          mkdir -p ipk_luci/usr/lib/lua/luci/model/cbi/npc
          mkdir -p ipk_luci/usr/share/rpcd/acl.d
          mkdir -p ipk_luci/usr/share/luci/menu.d
          
          # control 文件
          cat << EOF > ipk_luci/CONTROL/control
          Package: luci-app-npc
          Version: 1.0.0-r1
          Depends: npc, luci-base
          Architecture: all
          Maintainer: OpenWrt Team
          Description: LuCI interface for NPC - NPS Client
          EOF
          
          # 创建 LuCI 控制器 (简化版)
          cat << 'EOF' > ipk_luci/usr/lib/lua/luci/controller/npc/overview.lua
          module("luci.controller.npc.overview", package.seeall)
          
          function index()
            if not nixio.fs.access("/usr/bin/npc") then
              return
            end
            
            entry({"admin", "services", "npc"}, 
                  cbi("npc/overview"), 
                  "NPS Client", 
                  30)
          end
          EOF
          
          # 创建 CBI 配置页面
          cat << 'EOF' > ipk_luci/usr/lib/lua/luci/model/cbi/npc/overview.lua
          local m, s, o
          
          m = Map("npc", "NPS Client Configuration")
          
          s = m:section(TypedSection, "general", "General Settings")
          s.anonymous = true
          
          o = s:option(Value, "server_addr", "Server Address")
          o.default = "127.0.0.1:8024"
          o.rmempty = false
          
          o = s:option(Value, "conn_key", "Connection Key")
          o.password = true
          o.rmempty = false
          
          o = s:option(ListValue, "log_level", "Log Level")
          o:value("0", "None")
          o:value("3", "Info")
          o:value("4", "Debug")
          o.default = "3"
          
          return m
          EOF
          
          # ACL 权限配置
          cat << 'EOF' > ipk_luci/usr/share/rpcd/acl.d/luci-app-npc.json
          {
            "luci-app-npc": {
              "description": "Grant access to NPC configuration",
              "read": {
                "file": {
                  "/etc/npc/npc.conf": [ "read" ]
                }
              },
              "write": {
                "file": {
                  "/etc/npc/npc.conf": [ "write" ]
                }
              }
            }
          }
          EOF
          
          # 菜单配置
          cat << 'EOF' > ipk_luci/usr/share/luci/menu.d/luci-app-npc.json
          {
            "admin/services/npc": {
              "title": "NPS Client",
              "action": {
                "type": "view",
                "path": "npc/overview"
              }
            }
          }
          EOF
          
          # 打包 LuCI
          echo "打包 LuCI APP..."
          LUCI_PACKAGE="luci-app-npc_1.0.0-r1_all.apk"
          if [ -n "${IPKG_BUILD}" ] && [ -f "${IPKG_BUILD}" ]; then
            "${IPKG_BUILD}" -o root -g root ipk_luci "$OUT_DIR" 2>/dev/null || {
              # 手动打包
              cd ipk_luci
              tar -czf "../${OUT_DIR}/${LUCI_PACKAGE}" *
              cd ..
            }
          else
            /tmp/ipkg-build -o root -g root ipk_luci "$OUT_DIR" 2>/dev/null || {
              cd ipk_luci
              tar -czf "../${OUT_DIR}/${LUCI_PACKAGE}" *
              cd ..
            }
          fi
          
          # 清理临时文件
          rm -rf ipk_npc ipk_luci npc_extract npc_client.tar.gz sdk.tar.xz ${SDK_DIR}

      - name: List Built Packages
        run: |
          echo "## 📦 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 包名 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          if [ -d output ]; then
            for pkg in output/*; do
              if [ -f "$pkg" ]; then
                size=$(du -h "$pkg" | cut -f1)
                echo "| $(basename $pkg) | $size |" >> $GITHUB_STEP_SUMMARY
              fi
            done
          else
            echo "| 未找到构建产物 | - |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-npc-v${{ github.event.inputs.npc_version }}-for-r2s-e20c
          path: output/*
          retention-days: 30
