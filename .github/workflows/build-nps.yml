name: Build OpenWrt NPS Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build NPC v0.26.10 IPK Packages
        run: |
          NPC_VER="0.26.10"
          
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载 OpenWrt 官方 ipkg-build 打包脚本
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /tmp/ipkg-build
          chmod +x /tmp/ipkg-build

          # 2. 下载 yisier/nps 官方发布的 arm64 客户端预编译包
          wget -q https://github.com/yisier/nps/releases/download/v${NPC_VER}/linux_arm64_client.tar.gz
          mkdir -p npc_extract
          tar -xzf linux_arm64_client.tar.gz -C npc_extract/

          # 3. 创建 IPK 打包目录结构
          mkdir -p ipk_npc/CONTROL ipk_npc/usr/bin ipk_npc/etc/npc

          # 4. 复制 npc 二进制程序及配置文件
          cp npc_extract/npc ipk_npc/usr/bin/
          cp -r npc_extract/conf/* ipk_npc/etc/npc/ 2>/dev/null || true
          chmod +x ipk_npc/usr/bin/npc

          # 5. 写入 OpenWrt control 描述文件
          cat << EOF > ipk_npc/CONTROL/control
          Package: npc
          Version: ${NPC_VER}-1
          Depends: libc
          Architecture: aarch64_generic
          Maintainer: OpenWrt
          Description: Nps Client (npc) official binary for ARM64
          EOF

          # 6. 使用 ipkg-build 生成 IPK 安装包
          /tmp/ipkg-build ipk_npc "$OUT_DIR"

          # 7. 编译 LuCI Web 界面 (luci-app-nps / luci-app-npc)
          wget -q https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-npc luci-i18n-npc-zh-cn || ./scripts/feeds install luci-app-nps luci-i18n-nps-zh-cn || true
          make defconfig
          make package/feeds/luci/luci-app-npc/compile V=s || make package/feeds/luci/luci-app-nps/compile V=s || true
          find bin/packages/ -name "*npc*.ipk" -o -name "*nps*.ipk" | xargs -i cp {} "$OUT_DIR"/ 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-npc-v0.26.10-packages
          path: output/*.ipk
