name: Build OpenWrt FRP APK Package for R2S/E20C

on:
  workflow_dispatch:
    inputs:
      frp_version:
        description: 'FRP Version'
        required: true
        default: '0.71.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install APK Package Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apk-tools wget tar git

      - name: Build FRP & LuCI APK Packages
        run: |
          FRP_VER="${{ github.event.inputs.frp_version }}"
          # 为 R2S / E20C 锁定架构
          ARCH="aarch64"
          SUFFIX="arm64"
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          echo "Building for: R2S/E20C (${ARCH})"
          echo "FRP Version: ${FRP_VER}"

          # 1. 下载 FRP 官方 ARM64 二进制文件
          wget -q --show-progress "https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_${SUFFIX}.tar.gz"
          tar -xzf "frp_${FRP_VER}_linux_${SUFFIX}.tar.gz"
          FRP_DIR="frp_${FRP_VER}_linux_${SUFFIX}"

          # === 2. 打包 frpc.apk ===
          mkdir -p pkg_frpc/usr/bin pkg_frpc/etc/frp pkg_frpc/etc/init.d

          cp "${FRP_DIR}/frpc" pkg_frpc/usr/bin/
          chmod 755 pkg_frpc/usr/bin/frpc

          # 创建 .PKGINFO
          BIN_SIZE=$(du -sb pkg_frpc/usr/bin/frpc | awk '{print $1}')
          cat << EOF > pkg_frpc/.PKGINFO
          pkgname = frpc
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy client v${FRP_VER} for OpenWrt (R2S/E20C)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = ${BIN_SIZE}
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frpc
          tar -czf "${OUT_DIR}/frpc_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO etc/ usr/
          cd "${WORK_DIR}"

          # === 3. 打包 frps.apk ===
          mkdir -p pkg_frps/usr/bin pkg_frps/etc/frp pkg_frps/etc/init.d

          cp "${FRP_DIR}/frps" pkg_frps/usr/bin/
          chmod 755 pkg_frps/usr/bin/frps

          BIN_SIZE=$(du -sb pkg_frps/usr/bin/frps | awk '{print $1}')
          cat << EOF > pkg_frps/.PKGINFO
          pkgname = frps
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy server v${FRP_VER} for OpenWrt (R2S/E20C)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = ${BIN_SIZE}
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frps
          tar -czf "${OUT_DIR}/frps_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO etc/ usr/
          cd "${WORK_DIR}"

          # === 4. 构建 LuCI 界面 (使用 Lua API，兼容新版系统) ===
          echo "Building LuCI app for FRP client..."

          # 克隆社区修改版的 LuCI，兼容新版 OpenWrt 和 toml 配置
          git clone --depth 1 https://github.com/superzjg/luci-app-frpc_frps.git /tmp/luci-app-frpc-repo

          mkdir -p pkg_luci/usr/lib/lua/luci/controller \
                   pkg_luci/usr/lib/lua/luci/model/cbi \
                   pkg_luci/usr/lib/lua/luci/view \
                   pkg_luci/www/luci-static/resources \
                   pkg_luci/etc/config \
                   pkg_luci/etc/init.d

          if [ -d "/tmp/luci-app-frpc-repo/luasrc" ]; then
            cp -r /tmp/luci-app-frpc-repo/luasrc/* pkg_luci/usr/lib/lua/luci/ 2>/dev/null || true
          fi
          if [ -d "/tmp/luci-app-frpc-repo/root" ]; then
            cp -r /tmp/luci-app-frpc-repo/root/* pkg_luci/ 2>/dev/null || true
          fi

          # 创建 .PKGINFO
          cat << EOF > pkg_luci/.PKGINFO
          pkgname = luci-app-frpc
          pkgver = 1.0.0-r1
          pkgdesc = LuCI Support for FRP Client (Lua, compatible with 25.12.5)
          url = https://github.com/superzjg/luci-app-frpc_frps
          builddate = $(date +%s)
          packager = GitHub Actions
          arch = noarch
          depend = frpc
          EOF

          cd pkg_luci
          tar -czf "${OUT_DIR}/luci-app-frpc_1.0.0-r1_all.apk" .PKGINFO etc/ usr/ www/ 2>/dev/null || true
          cd "${WORK_DIR}"

          echo "✅ All packages built successfully!"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-frp-apk-r2s-e20c
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30
