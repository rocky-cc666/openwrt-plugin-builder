name: Build OpenWrt FRP APK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install APK Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apk-tools wget tar

      - name: Build FRP & LuCI APK Packages
        run: |
          FRP_VER="0.71.0"
          ARCH="aarch64"
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载 FRP 官方 binary
          echo "Downloading FRP binary..."
          wget -q "https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_arm64.tar.gz"
          tar -xzf "frp_${FRP_VER}_linux_arm64.tar.gz"

          # --- 打包 frpc.apk ---
          echo "Packaging frpc.apk..."
          mkdir -p pkg_frpc/usr/bin pkg_frpc/lib/apk/db
          cp "frp_${FRP_VER}_linux_arm64/frpc" pkg_frpc/usr/bin/
          chmod +x pkg_frpc/usr/bin/frpc

          cat << EOF > pkg_frpc/.PKGINFO
          pkgname = frpc
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy client (v0.71.0 binary for ARM64)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb pkg_frpc/usr/bin/frpc | awk '{print $1}')
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frpc
          tar -czf "$OUT_DIR/frpc_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO usr/
          cd "$WORK_DIR"

          # --- 打包 frps.apk ---
          echo "Packaging frps.apk..."
          mkdir -p pkg_frps/usr/bin pkg_frps/lib/apk/db
          cp "frp_${FRP_VER}_linux_arm64/frps" pkg_frps/usr/bin/
          chmod +x pkg_frps/usr/bin/frps

          cat << EOF > pkg_frps/.PKGINFO
          pkgname = frps
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy server (v0.71.0 binary for ARM64)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb pkg_frps/usr/bin/frps | awk '{print $1}')
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frps
          tar -czf "$OUT_DIR/frps_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO usr/
          cd "$WORK_DIR"

          # 2. 获取并打包 OpenWrt 官方 25.x 的 luci-app-frpc 和 中文界面
          echo "Downloading LuCI App FRP files..."
          git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci-src

          # --- 打包 luci-app-frpc.apk ---
          if [ -d "/tmp/luci-src/applications/luci-app-frpc/htdocs" ]; then
            mkdir -p pkg_luci_frpc/www pkg_luci_frpc/usr/share/luci pkg_luci_frpc/etc/config pkg_luci_frpc/etc/init.d
            
            # 提取 UI 静态和动态资源文件
            cp -r /tmp/luci-src/applications/luci-app-frpc/htdocs/* pkg_luci_frpc/www/ 2>/dev/null || true
            cp -r /tmp/luci-src/applications/luci-app-frpc/root/* pkg_luci_frpc/ 2>/dev/null || true

            cat << EOF > pkg_luci_frpc/.PKGINFO
            pkgname = luci-app-frpc
            pkgver = 1.0.0-r1
            pkgdesc = LuCI Support for FRP Client
            url = https://github.com/openwrt/luci
            builddate = $(date +%s)
            packager = GitHub Actions
            arch = noarch
            depend = frpc luci-base
            EOF

            cd pkg_luci_frpc
            tar -czf "$OUT_DIR/luci-app-frpc_1.0.0-r1_all.apk" .PKGINFO * 2>/dev/null || true
            cd "$WORK_DIR"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-frp-apk-packages
          path: output/*.apk
