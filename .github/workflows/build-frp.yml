name: Build OpenWrt FRP APK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install APK Package Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apk-tools wget tar git

      - name: Build FRP & LuCI APK Packages for OpenWrt 25.12.5
        run: |
          FRP_VER="0.71.0"
          ARCH="aarch64"
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载 FRP 官方二进制文件
          wget -q "https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_arm64.tar.gz"
          tar -xzf "frp_${FRP_VER}_linux_arm64.tar.gz"

          # --- 打包 frpc.apk ---
          mkdir -p pkg_frpc/usr/bin
          cp "frp_${FRP_VER}_linux_arm64/frpc" pkg_frpc/usr/bin/
          chmod +x pkg_frpc/usr/bin/frpc

          cat << EOF > pkg_frpc/.PKGINFO
          pkgname = frpc
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy client (v0.71.0 binary for ARM64)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb pkg_frpc/usr/bin/frpc | awk '{print $1}')
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frpc
          tar -czf "$OUT_DIR/frpc_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO usr/
          cd "$WORK_DIR"

          # --- 打包 frps.apk ---
          mkdir -p pkg_frps/usr/bin
          cp "frp_${FRP_VER}_linux_arm64/frps" pkg_frps/usr/bin/
          chmod +x pkg_frps/usr/bin/frps

          cat << EOF > pkg_frps/.PKGINFO
          pkgname = frps
          pkgver = ${FRP_VER}-r1
          pkgdesc = A fast reverse proxy server (v0.71.0 binary for ARM64)
          url = https://github.com/fatedier/frp
          builddate = $(date +%s)
          packager = GitHub Actions
          size = $(du -sb pkg_frps/usr/bin/frps | awk '{print $1}')
          arch = ${ARCH}
          depend = libc
          EOF

          cd pkg_frps
          tar -czf "$OUT_DIR/frps_${FRP_VER}-r1_${ARCH}.apk" .PKGINFO usr/
          cd "$WORK_DIR"

          # 2. 提取 OpenWrt 官方 LuCI 文件并打包为 luci-app-frpc.apk
          git clone --depth 1 -b openwrt-23.05 https://github.com/openwrt/luci.git /tmp/luci-src

          mkdir -p pkg_luci/usr/share/luci/menu.d \
                   pkg_luci/usr/share/rpcd/acl.d \
                   pkg_luci/www/luci-static/resources/view/frpc \
                   pkg_luci/etc/config \
                   pkg_luci/etc/init.d

          # 复制配置文件与 Web 页面静态资源
          if [ -d "/tmp/luci-src/applications/luci-app-frpc" ]; then
            cp -r /tmp/luci-src/applications/luci-app-frpc/root/* pkg_luci/ 2>/dev/null || true
            cp -r /tmp/luci-src/applications/luci-app-frpc/htdocs/* pkg_luci/www/ 2>/dev/null || true
          fi

          cat << EOF > pkg_luci/.PKGINFO
          pkgname = luci-app-frpc
          pkgver = 1.0.0-r1
          pkgdesc = LuCI Support for FRP Client
          url = https://github.com/openwrt/luci
          builddate = $(date +%s)
          packager = GitHub Actions
          arch = noarch
          depend = frpc
          EOF

          cd pkg_luci
          tar -czf "$OUT_DIR/luci-app-frpc_1.0.0-r1_all.apk" .PKGINFO * 2>/dev/null || true
          cd "$WORK_DIR"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-frp-apk-packages
          path: output/*.apk
