name: Build OpenWrt FRP Plugin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build FRP v0.71.0 IPK Packages
        run: |
          FRP_VER="0.71.0"
          
          # 创建输出绝对路径，彻底避免 ipkg-build 找不到目录
          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载 OpenWrt 官方 ipkg-build 打包脚本
          wget -q https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build -O /tmp/ipkg-build
          chmod +x /tmp/ipkg-build

          # 2. 下载 FRP 官方最新 aarch64 二进制文件
          wget -q https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_arm64.tar.gz
          tar -xzf frp_${FRP_VER}_linux_arm64.tar.gz

          # --- 打包 frpc (客户端) ---
          mkdir -p ipk_frpc/CONTROL ipk_frpc/usr/bin
          cp frp_${FRP_VER}_linux_arm64/frpc ipk_frpc/usr/bin/
          chmod +x ipk_frpc/usr/bin/frpc

          cat << EOF > ipk_frpc/CONTROL/control
          Package: frpc
          Version: ${FRP_VER}-1
          Depends: libc
          Architecture: aarch64_generic
          Maintainer: OpenWrt
          Description: A fast reverse proxy client (v0.71.0 official binary for ARM64)
          EOF

          /tmp/ipkg-build ipk_frpc "$OUT_DIR"

          # --- 打包 frps (服务端) ---
          mkdir -p ipk_frps/CONTROL ipk_frps/usr/bin
          cp frp_${FRP_VER}_linux_arm64/frps ipk_frps/usr/bin/
          chmod +x ipk_frps/usr/bin/frps

          cat << EOF > ipk_frps/CONTROL/control
          Package: frps
          Version: ${FRP_VER}-1
          Depends: libc
          Architecture: aarch64_generic
          Maintainer: OpenWrt
          Description: A fast reverse proxy server (v0.71.0 official binary for ARM64)
          EOF

          /tmp/ipkg-build ipk_frps "$OUT_DIR"

          # 3. 提取编译 LuCI 网页界面 (luci-app-frpc & 中文语言包)
          wget -q https://downloads.openwrt.org/releases/23.05.0/targets/rockchip/armv8/openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          cd openwrt-sdk-23.05.0-rockchip-armv8_gcc-12.3.0_musl.Linux-x86_64
          ./scripts/feeds update -a
          ./scripts/feeds install luci-app-frpc luci-i18n-frpc-zh-cn
          make defconfig
          make package/feeds/luci/luci-app-frpc/compile V=s
          find bin/packages/ -name "luci-app-frpc*.ipk" -o -name "luci-i18n-frpc-zh-cn*.ipk" | xargs -i cp {} "$OUT_DIR"/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-frp-v0.71.0-complete-packages
          path: output/*.ipk
