name: Build OpenWrt FRP APK Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext build-essential libncurses5-dev libncursesw5-dev zlib1g-dev gawk git ccache gettext xsltproc

      - name: Build FRP APK Packages for OpenWrt 25.12.5
        run: |
          FRP_VER="0.71.0"
          SDK_VER="25.12.5"
          SDK_URL="https://downloads.openwrt.org/releases/${SDK_VER}/targets/rockchip/armv8/openwrt-sdk-${SDK_VER}-rockchip-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.xz"

          WORK_DIR=$(pwd)
          OUT_DIR="${WORK_DIR}/output"
          mkdir -p "$OUT_DIR"

          # 1. 下载并解压 25.12.5 SDK
          wget -q "$SDK_URL" -O openwrt-sdk.tar.xz
          tar -xf openwrt-sdk.tar.xz
          SDK_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          cd "$SDK_DIR"

          # 2. 更新并安装 Feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 3. 预先编译 po2lmo 等核心 Host 工具，防止报错 po2lmo: command not found
          make package/luci-base/host/compile V=s || true

          # 4. 创建自定义 FRP 客户端和服务端 Package
          mkdir -p package/custom/frpc package/custom/frps

          # 创建 frpc Makefile
          cat << 'EOF' > package/custom/frpc/Makefile
include $(TOPDIR)/rules.mk

PKG_NAME:=frpc
PKG_VERSION:=0.71.0
PKG_RELEASE:=1

include $(INCLUDE_DIR)/package.mk

define Package/frpc
  SECTION:=net
  CATEGORY:=Network
  TITLE:=A fast reverse proxy client (v0.71.0 prebuilt binary)
  DEPENDS:=+libc
endef

define Build/Compile
endef

define Package/frpc/install
	$(INSTALL_DIR) $(1)/usr/bin
	$(INSTALL_BIN) $(PKG_BUILD_DIR)/frpc $(1)/usr/bin/
endef

$(eval $(call BuildPackage,frpc))
EOF

          # 创建 frps Makefile
          cat << 'EOF' > package/custom/frps/Makefile
include $(TOPDIR)/rules.mk

PKG_NAME:=frps
PKG_VERSION:=0.71.0
PKG_RELEASE:=1

include $(INCLUDE_DIR)/package.mk

define Package/frps
  SECTION:=net
  CATEGORY:=Network
  TITLE:=A fast reverse proxy server (v0.71.0 prebuilt binary)
  DEPENDS:=+libc
endef

define Build/Compile
endef

define Package/frps/install
	$(INSTALL_DIR) $(1)/usr/bin
	$(INSTALL_BIN) $(PKG_BUILD_DIR)/frps $(1)/usr/bin/
endef

$(eval $(call BuildPackage,frps))
EOF

          # 5. 下载 FRP 预编译二进制文件
          wget -q "https://github.com/fatedier/frp/releases/download/v${FRP_VER}/frp_${FRP_VER}_linux_arm64.tar.gz"
          tar -xzf "frp_${FRP_VER}_linux_arm64.tar.gz"

          mkdir -p package/custom/frpc/src package/custom/frps/src
          cp "frp_${FRP_VER}_linux_arm64/frpc" package/custom/frpc/src/
          cp "frp_${FRP_VER}_linux_arm64/frps" package/custom/frps/src/
          echo 'all:' > package/custom/frpc/src/Makefile
          echo 'all:' > package/custom/frps/src/Makefile

          # 6. 配置编译参数（生成 APK）
          echo "CONFIG_PACKAGE_frpc=m" >> .config
          echo "CONFIG_PACKAGE_frps=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-frpc=m" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-frpc-zh-cn=m" >> .config
          make defconfig

          # 7. 编译软件包
          make package/custom/frpc/compile V=s
          make package/custom/frps/compile V=s
          make package/feeds/luci/luci-app-frpc/compile V=s

          # 8. 收集所有生成的 .apk 安装包
          find bin/ -name "*.apk" -exec cp {} "$OUT_DIR"/ \;

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-frp-apk-packages
          path: output/*.apk
