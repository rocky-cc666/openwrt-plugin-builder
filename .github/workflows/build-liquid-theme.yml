name: Build Theme

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache file g++ gawk gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev python3 python3-pip \
            rsync unzip wget xsltproc zlib1g-dev zstd

      - name: Download SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          wget -q "${SDK_URL}" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Verify SDK
        run: |
          cd openwrt-sdk
          test -f Makefile

      - name: Update feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Get theme
        run: |
          cd openwrt-sdk/package
          git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid.git

      - name: Config
        run: |
          cd openwrt-sdk
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_PACKAGE_luci-theme-liquid=y
          CONFIG_USE_APK=y
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_IMAGEOPT=n
          EOF
          make defconfig

      - name: Compile
        run: |
          cd openwrt-sdk
          make package/luci-theme-liquid/compile -j$(nproc) V=s

      - name: Collect all APKs
        run: |
          echo "=========================================="
          echo "查找所有 .apk 文件..."
          echo "=========================================="
          
          # 在 SDK 目录中查找所有 .apk
          find openwrt-sdk -name "*.apk" -type f | while read file; do
            echo "找到: $file"
            cp -v "$file" ./
          done
          
          echo "=========================================="
          echo "当前目录下的 .apk 文件:"
          ls -lh *.apk 2>/dev/null || echo "⚠️ 没有找到 .apk 文件"
          echo "=========================================="

      - name: Upload all APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: "*.apk"
          retention-days: 30
