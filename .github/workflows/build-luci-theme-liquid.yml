# .github/workflows/build-liquid-theme.yml
name: Build Liquid Theme APK for OpenWrt 25.12.5

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本 (如 25.12.5, 24.10.0)'
        required: true
        default: '25.12.5'
        type: string
      target_arch:
        description: '目标架构 (推荐 armsr/armv8，或者 rockchip/armv8)'
        required: true
        default: 'armsr/armv8'
        type: string
      package_name:
        description: '主题包名称'
        required: true
        default: 'luci-theme-liquid'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==================== 步骤1: 准备环境 ====================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            file \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev
          echo "✅ 依赖安装完成"

      # ==================== 步骤2: 下载 SDK ====================
      - name: 下载 OpenWrt SDK
        id: download_sdk
        run: |
          VERSION="${{ github.event.inputs.openwrt_version }}"
          ARCH="${{ github.event.inputs.target_arch }}"
          
          echo "正在下载 OpenWrt ${VERSION} SDK，架构: ${ARCH}"
          
          # 构建 SDK URL
          SDK_BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${ARCH}"
          echo "SDK 目录: ${SDK_BASE_URL}"
          
          # 先列出目录内容，看看有哪些 SDK 文件
          echo "正在检查 SDK 目录..."
          wget -q --spider "${SDK_BASE_URL}/" || {
            echo "❌ 架构路径不存在！"
            echo "请访问 https://downloads.openwrt.org/releases/${VERSION}/targets/ 查看支持的架构"
            echo "R2S/E20C 推荐使用: armsr/armv8 或 rockchip/armv8"
            exit 1
          }
          
          # 尝试下载 SDK（使用通配符匹配）
          echo "开始下载 SDK..."
          wget -q --show-progress \
            "${SDK_BASE_URL}/openwrt-sdk-${VERSION}-$(echo ${ARCH} | tr '/' '-')_gcc-*.Linux-x86_64.tar.xz" \
            -O sdk.tar.xz 2>&1 || {
              echo "第一次下载失败，尝试备用方式..."
              # 尝试使用更通用的匹配
              wget -q --show-progress \
                "${SDK_BASE_URL}/openwrt-sdk-${VERSION}-*.Linux-x86_64.tar.xz" \
                -O sdk.tar.xz
            }
          
          if [ ! -f sdk.tar.xz ] || [ ! -s sdk.tar.xz ]; then
            echo "============================================"
            echo "❌ SDK 下载失败！"
            echo "请访问以下地址手动查看可用的 SDK："
            echo "${SDK_BASE_URL}/"
            echo "然后根据实际文件名，修改工作流中的下载 URL"
            echo "============================================"
            exit 1
          fi
          
          echo "✅ SDK 下载成功，文件大小: $(du -h sdk.tar.xz | cut -f1)"
          echo "开始解压 SDK..."
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk
          echo "✅ SDK 解压完成"

      # ==================== 步骤3: 验证 SDK ====================
      - name: 验证 SDK
        run: |
          cd openwrt-sdk
          if [ -f "Makefile" ]; then
            echo "✅ SDK 验证通过"
            echo "SDK 版本信息:"
            cat include/version.mk | grep "VERSION_NUMBER" || echo "无法读取版本信息"
          else
            echo "❌ SDK 验证失败，未找到 Makefile"
            exit 1
          fi

      # ==================== 步骤4: 更新 feeds ====================
      - name: 更新 feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ feeds 更新完成"

      # ==================== 步骤5: 准备主题源码 ====================
      - name: 准备主题源码
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          # 检查当前仓库是否包含主题源码
          if [ -d "${PACKAGE}" ]; then
            echo "发现本地主题源码，正在复制..."
            cp -r "${PACKAGE}" "openwrt-sdk/package/"
          else
            echo "未找到本地源码，从 GitHub 克隆最新版..."
            cd openwrt-sdk/package
            git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid.git
          fi
          echo "✅ 主题源码准备完成"
          
          # 验证主题源码是否存在
          if [ -d "openwrt-sdk/package/${PACKAGE}" ]; then
            echo "✅ 主题源码已就位"
          else
            echo "❌ 主题源码未正确放置"
            exit 1
          fi

      # ==================== 步骤6: 配置编译 ====================
      - name: 配置编译参数
        run: |
          cd openwrt-sdk
          ARCH="${{ github.event.inputs.target_arch }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          # 提取架构前缀（如 armsr/armv8 -> armsr）
          ARCH_PREFIX=$(echo ${ARCH} | cut -d'/' -f1)
          ARCH_SUFFIX=$(echo ${ARCH} | cut -d'/' -f2)
          
          # 生成最小化配置
          cat > .config << EOF
          # 目标平台
          CONFIG_TARGET_${ARCH_PREFIX}=y
          CONFIG_TARGET_${ARCH_PREFIX}_${ARCH_SUFFIX}=y
          CONFIG_TARGET_${ARCH_PREFIX}_${ARCH_SUFFIX}_DEVICE_generic=y
          
          # 编译我们的主题包
          CONFIG_PACKAGE_${PACKAGE}=y
          
          # 使用 APK 包格式（OpenWrt 25.12+）
          CONFIG_USE_APK=y
          
          # 加速编译，只编译必要的部分
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_IMAGEOPT=n
          CONFIG_PKG_BUILD_JOBS=4
          EOF
          
          echo "配置内容:"
          cat .config
          
          # 生成最终配置
          make defconfig
          echo "✅ 编译配置完成"

      # ==================== 步骤7: 执行编译 ====================
      - name: 编译主题包
        run: |
          cd openwrt-sdk
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          echo "开始编译 ${PACKAGE}..."
          make package/${PACKAGE}/compile -j$(nproc) V=s
          
          if [ $? -eq 0 ]; then
            echo "✅ 编译成功！"
          else
            echo "❌ 编译失败，请查看上方日志"
            exit 1
          fi

      # ==================== 步骤8: 收集产物 ====================
      - name: 收集编译产物
        id: collect
        run: |
          # 查找所有 .apk 文件（优先）
          find openwrt-sdk -name "*.apk" -type f -exec cp -v {} ./ \; 2>/dev/null || true
          
          # 如果没找到 .apk，查找 .ipk
          if [ $(find . -maxdepth 1 -name "*.apk" | wc -l) -eq 0 ]; then
            echo "未找到 .apk 文件，尝试查找 .ipk..."
            find openwrt-sdk -name "*.ipk" -type f -exec cp -v {} ./ \; 2>/dev/null || true
          fi
          
          # 统计文件数量
          APK_COUNT=$(find . -maxdepth 1 -name "*.apk" | wc -l)
          IPK_COUNT=$(find . -maxdepth 1 -name "*.ipk" | wc -l)
          
          echo "找到 ${APK_COUNT} 个 .apk 文件，${IPK_COUNT} 个 .ipk 文件"
          
          if [ ${APK_COUNT} -eq 0 ] && [ ${IPK_COUNT} -eq 0 ]; then
            echo "❌ 错误：未找到任何编译产物！"
            echo "请检查编译日志"
            exit 1
          fi
          
          echo "✅ 编译产物列表:"
          ls -lh *.apk 2>/dev/null || ls -lh *.ipk 2>/dev/null

      # ==================== 步骤9: 上传产物 ====================
      - name: 上传 APK 包
        uses: actions/upload-artifact@v4
        with:
          name: liquid-theme-25.12.5-armv8
          path: |
            *.apk
            *.ipk
          retention-days: 30
          if-no-files-found: error

      # ==================== 步骤10: 显示完成信息 ====================
      - name: 编译完成
        run: |
          echo "=========================================="
          echo "🎉 编译完成！"
          echo "📦 下载地址: Actions 页面下方的 Artifacts 区域"
          echo "=========================================="
          echo ""
          echo "安装命令："
          echo "  apk add --allow-untrusted /tmp/你的文件名.apk"
          echo ""
          echo "支持的架构："
          echo "  - armsr/armv8 (通用 ARMv8)"
          echo "  - rockchip/armv8 (Rockchip 平台)"
