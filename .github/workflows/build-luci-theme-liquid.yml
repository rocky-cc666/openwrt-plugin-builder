# .github/workflows/build-liquid-theme.yml
name: Build Liquid Theme APK for OpenWrt 25.12.5

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache file g++ gawk gettext git \
            libncurses5-dev libncursesw5-dev libssl-dev \
            python3 python3-pip rsync unzip wget xsltproc zlib1g-dev zstd

      - name: 下载 OpenWrt SDK
        run: |
          # 正确路径：armsr/armv8（注意是 armsr，不是 armrs 或 armrsr）
          SDK_URL="https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          
          echo "下载: ${SDK_URL}"
          
          wget -q --show-progress "${SDK_URL}" -O sdk.tar.zst || {
            echo "尝试 .tar.xz..."
            wget -q --show-progress "https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.xz" -O sdk.tar.xz
            if [ -f sdk.tar.xz ] && [ -s sdk.tar.xz ]; then
              echo "✅ .tar.xz 下载成功"
              tar -xf sdk.tar.xz
            else
              echo "❌ 下载失败"
              echo "请手动访问: https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/"
              exit 1
            fi
          }
          
          if [ -f sdk.tar.zst ] && [ -s sdk.tar.zst ]; then
            echo "✅ .tar.zst 下载成功"
            tar --zstd -xf sdk.tar.zst
          fi
          
          mv openwrt-sdk-* openwrt-sdk || true
          
          if [ -d "openwrt-sdk" ]; then
            echo "✅ SDK 准备就绪"
          else
            echo "❌ SDK 解压失败"
            exit 1
          fi

      - name: 验证 SDK
        run: |
          cd openwrt-sdk
          [ -f "Makefile" ] || exit 1
          echo "✅ SDK 验证通过"

      - name: 更新 feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 准备主题源码
        run: |
          cd openwrt-sdk/package
          git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid.git

      - name: 配置编译
        run: |
          cd openwrt-sdk
          cat > .config << 'EOF'
          CONFIG_TARGET_armsr=y
          CONFIG_TARGET_armsr_armv8=y
          CONFIG_TARGET_armsr_armv8_DEVICE_generic=y
          CONFIG_PACKAGE_luci-theme-liquid=y
          CONFIG_USE_APK=y
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_IMAGEOPT=n
          EOF
          make defconfig

      - name: 编译主题包
        run: |
          cd openwrt-sdk
          make package/luci-theme-liquid/compile -j$(nproc) V=s

      - name: 收集产物
        run: |
          cd openwrt-sdk
          find . -name "*.apk" -type f -exec cp -v {} ../ \; 2>/dev/null || true
          find . -name "*.ipk" -type f -exec cp -v {} ../ \; 2>/dev/null || true
          cd ..
          echo "=========================================="
          ls -lh *.apk 2>/dev/null || ls -lh *.ipk 2>/dev/null || echo "未找到产物"
          echo "=========================================="

      - name: 上传 APK 包
        uses: actions/upload-artifact@v4
        with:
          name: liquid-theme-25.12.5
          path: |
            *.apk
            *.ipk
          retention-days: 30
          if-no-files-found: warn
