# .github/workflows/build-liquid-theme.yml
name: Build Liquid Theme APK for OpenWrt 25.12.5

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本 (如 25.12.5, 24.10.0)'
        required: true
        default: '25.12.5'
        type: string
      target_arch:
        description: '目标架构 (armsr/armv8 或 rockchip/armv8)'
        required: true
        default: 'armsr/armv8'
        type: string
      package_name:
        description: '主题包名称'
        required: true
        default: 'luci-theme-liquid'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==================== 步骤1: 准备环境 ====================
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            file \
            g++ \
            gawk \
            gettext \
            git \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xsltproc \
            zlib1g-dev
          echo "✅ 依赖安装完成"

      # ==================== 步骤2: 下载 SDK（修正版） ====================
      - name: 下载 OpenWrt SDK
        id: download_sdk
        run: |
          VERSION="${{ github.event.inputs.openwrt_version }}"
          ARCH="${{ github.event.inputs.target_arch }}"
          
          echo "正在下载 OpenWrt ${VERSION} SDK，架构: ${ARCH}"
          
          # SDK 基础 URL
          SDK_BASE_URL="https://downloads.openwrt.org/releases/${VERSION}/targets/${ARCH}"
          echo "SDK 目录: ${SDK_BASE_URL}"
          
          # 方法1: 使用 curl 获取目录列表，找到 SDK 文件名
          echo "正在获取 SDK 文件列表..."
          
          # 获取目录中的文件列表，过滤出 SDK 文件名
          SDK_FILE=$(curl -s "${SDK_BASE_URL}/" 2>/dev/null | \
            grep -o 'openwrt-sdk-[^"]*\.tar\.xz' | \
            head -1)
          
          if [ -n "${SDK_FILE}" ]; then
            echo "✅ 找到 SDK 文件: ${SDK_FILE}"
            SDK_URL="${SDK_BASE_URL}/${SDK_FILE}"
          else
            echo "⚠️ 通过目录列表未找到 SDK，尝试直接构建 URL..."
            
            # 方法2: 尝试常见的 GCC 版本组合
            for GCC_VER in "13.3.0" "13.2.0" "12.3.0"; do
              TEST_URL="${SDK_BASE_URL}/openwrt-sdk-${VERSION}-$(echo ${ARCH} | tr '/' '-')_gcc-${GCC_VER}_musl.Linux-x86_64.tar.xz"
              echo "尝试: ${TEST_URL}"
              if wget -q --spider "${TEST_URL}" 2>/dev/null; then
                SDK_URL="${TEST_URL}"
                echo "✅ 找到 SDK: ${SDK_URL}"
                break
              fi
            done
          fi
          
          # 如果仍然没有找到，报错退出
          if [ -z "${SDK_URL}" ]; then
            echo "============================================"
            echo "❌ 无法找到 SDK 文件！"
            echo "请手动访问以下地址查看可用的 SDK："
            echo "${SDK_BASE_URL}/"
            echo "然后根据实际文件名，手动修改工作流"
            echo "============================================"
            exit 1
          fi
          
          # 下载 SDK
          echo "开始下载 SDK..."
          wget -q --show-progress "${SDK_URL}" -O sdk.tar.xz
          
          if [ ! -f sdk.tar.xz ] || [ ! -s sdk.tar.xz ]; then
            echo "❌ SDK 下载失败！"
            exit 1
          fi
          
          echo "✅ SDK 下载成功，文件大小: $(du -h sdk.tar.xz | cut -f1)"
          echo "开始解压 SDK..."
          tar -xf sdk.tar.xz
          mv openwrt-sdk-* openwrt-sdk
          echo "✅ SDK 解压完成"

      # ==================== 步骤3: 验证 SDK ====================
      - name: 验证 SDK
        run: |
          cd openwrt-sdk
          if [ -f "Makefile" ]; then
            echo "✅ SDK 验证通过"
            echo "SDK 内容:"
            ls -la | head -20
          else
            echo "❌ SDK 验证失败，未找到 Makefile"
            echo "当前目录内容:"
            ls -la
            exit 1
          fi

      # ==================== 步骤4: 更新 feeds ====================
      - name: 更新 feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "✅ feeds 更新完成"

      # ==================== 步骤5: 准备主题源码 ====================
      - name: 准备主题源码
        run: |
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          cd openwrt-sdk/package
          
          # 直接从 GitHub 克隆主题源码
          echo "从 GitHub 克隆主题源码..."
          git clone --depth 1 https://github.com/zzsj0928/luci-theme-liquid.git
          
          if [ -d "${PACKAGE}" ]; then
            echo "✅ 主题源码已就位"
          else
            echo "❌ 主题源码克隆失败"
            exit 1
          fi

      # ==================== 步骤6: 配置编译 ====================
      - name: 配置编译参数
        run: |
          cd openwrt-sdk
          ARCH="${{ github.event.inputs.target_arch }}"
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          # 提取架构前缀
          ARCH_PREFIX=$(echo ${ARCH} | cut -d'/' -f1)
          ARCH_SUFFIX=$(echo ${ARCH} | cut -d'/' -f2)
          
          # 生成最小化配置
          cat > .config << EOF
          # 目标平台
          CONFIG_TARGET_${ARCH_PREFIX}=y
          CONFIG_TARGET_${ARCH_PREFIX}_${ARCH_SUFFIX}=y
          CONFIG_TARGET_${ARCH_PREFIX}_${ARCH_SUFFIX}_DEVICE_generic=y
          
          # 编译我们的主题包
          CONFIG_PACKAGE_${PACKAGE}=y
          
          # 使用 APK 包格式（OpenWrt 25.12+）
          CONFIG_USE_APK=y
          
          # 加速编译
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_TARGET_IMAGES_GZIP=n
          CONFIG_IMAGEOPT=n
          CONFIG_PKG_BUILD_JOBS=4
          EOF
          
          echo "配置内容:"
          cat .config
          
          make defconfig
          echo "✅ 编译配置完成"

      # ==================== 步骤7: 执行编译 ====================
      - name: 编译主题包
        run: |
          cd openwrt-sdk
          PACKAGE="${{ github.event.inputs.package_name }}"
          
          echo "开始编译 ${PACKAGE}..."
          make package/${PACKAGE}/compile -j$(nproc) V=s
          
          if [ $? -eq 0 ]; then
            echo "✅ 编译成功！"
          else
            echo "❌ 编译失败，请查看上方日志"
            exit 1
          fi

      # ==================== 步骤8: 收集产物 ====================
      - name: 收集编译产物
        id: collect
        run: |
          # 查找所有 .apk 文件
          find openwrt-sdk -name "*.apk" -type f -exec cp -v {} ./ \; 2>/dev/null || true
          
          # 如果没找到 .apk，查找 .ipk
          if [ $(find . -maxdepth 1 -name "*.apk" | wc -l) -eq 0 ]; then
            echo "未找到 .apk 文件，尝试查找 .ipk..."
            find openwrt-sdk -name "*.ipk" -type f -exec cp -v {} ./ \; 2>/dev/null || true
          fi
          
          APK_COUNT=$(find . -maxdepth 1 -name "*.apk" | wc -l)
          IPK_COUNT=$(find . -maxdepth 1 -name "*.ipk" | wc -l)
          
          echo "找到 ${APK_COUNT} 个 .apk 文件，${IPK_COUNT} 个 .ipk 文件"
          
          if [ ${APK_COUNT} -eq 0 ] && [ ${IPK_COUNT} -eq 0 ]; then
            echo "❌ 未找到编译产物！"
            echo "查找路径:"
            find openwrt-sdk -name "*.ipk" -o -name "*.apk" | head -20
            exit 1
          fi
          
          echo "✅ 编译产物:"
          ls -lh *.apk 2>/dev/null || ls -lh *.ipk 2>/dev/null

      # ==================== 步骤9: 上传产物 ====================
      - name: 上传 APK 包
        uses: actions/upload-artifact@v4
        with:
          name: liquid-theme-25.12.5-armv8
          path: |
            *.apk
            *.ipk
          retention-days: 30
          if-no-files-found: warn

      # ==================== 步骤10: 完成 ====================
      - name: 编译完成
        run: |
          echo "=========================================="
          echo "🎉 编译完成！"
          echo "📦 下载: Actions 页面下方的 Artifacts"
          echo "=========================================="
